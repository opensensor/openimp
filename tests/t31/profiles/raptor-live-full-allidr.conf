[sensor]
fps = 25

[stream0]
enabled = true
# The GC2053/open-tx-isp registry reports 1920x1080. Omitting width and
# height makes Raptor select that live sensor resolution rather than baking a
# platform dimension into OpenIMP.
fps = 25
codec = h264
profile = 2
bitrate = 8000000
rc_mode = vbr
min_qp = 18
max_qp = 42
gop = 1
nr_vbs = 2
osd_enabled = false
jpeg = false

[stream1]
enabled = false

[jpeg]
enabled = false

[ring]
refmode = true
main_slots = 8

[audio]
enabled = false
ao_enabled = false

[rtsp]
enabled = true
port = 554
max_clients = 1
endpoint_main = ch0
username = thingino
password = thingino

[http]
enabled = false

[osd]
enabled = false

[ircut]
enabled = true
mode = day
trigger = luma

[recording]
enabled = false

[webrtc]
enabled = false

[motion]
enabled = false

[log]
level = debug
target = stderr

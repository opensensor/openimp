[sensor]
fps = 25

[stream0]
enabled = true
# Let Raptor select the live sensor resolution.  OpenIMP derives all encoder
# geometry and buffer sizing from that configured frame-source resolution.
fps = 25
codec = h264
profile = 2
bitrate = 8000000
rc_mode = vbr
min_qp = 18
max_qp = 42
gop = 25
nr_vbs = 2
osd_enabled = false
jpeg = false

[stream1]
enabled = false

[jpeg]
enabled = false

[ring]
# OpenIMP owns and recycles its AVPU output buffers after ReleaseStream.
# Raptor refmode keeps zero-copy references beyond that API lifetime and can
# therefore observe a later frame in the same buffer.  Use the ordinary copy
# ring until both sides share an explicit buffer-generation contract.
refmode = false
main_slots = 8

[audio]
enabled = false
ao_enabled = false

[rtsp]
enabled = true
port = 554
max_clients = 1
endpoint_main = ch0
username = thingino
password = thingino

[http]
enabled = false

[osd]
enabled = false

[ircut]
enabled = true
mode = day
trigger = luma

[recording]
enabled = false

[webrtc]
enabled = false

[motion]
enabled = false

[log]
level = debug
target = stderr

      text: '2026-10-24 (open-tx-isp `claude/t40-quality`, merged into next `9730342f`; Eufy .184 sc830ai, A/B with the vendor stack in the same scene, stream consumer attached, 0 oops in 8 runs of about 2 h; the image build with it and a soak are still to come): the vendor AE per frame now runs by default (`enable_core_ops_cb=1`, the old default 0 never triggered the OEM core ISR), IT limit from the sensor attribute (2241), target 118, two gain steps at a large error, 9 %/5 % gain bands against a limit cycle, ISP digital gain up to 4x through the OEM GIB entry: day luma 119 against the vendor 122 (before 108), 100 -> 255 light step settles in under 1 s (vendor 1.5 s, before 11.1 s), luma at the dark step 124 against the vendor 105 (before 63). Earlier (history): A/B against the vendor stack, Eufy .184, 2026-10-24 (next 2c29ce79 code, image agg43c with `enable_core_ops_cb=0`, i.e. without the per-frame vendor AE of the line above): day luma 108 against 122, the AE reacts in 4.8 s / settles in 11.1 s against 0.5 s / 2.9 s for the vendor, and at the light step (255 -> 100) the luma drops 107 -> 63 (vendor 122 -> 105). `claude/t40-quality` (local branch, not in next) fixes the default (`enable_core_ops_cb=1`, own AE tick, IT limit from the sensor attribute 2241, target 118): day luma 127, AE back in under 1 s, 105 -> 69 at the dark step (sensor gain at its 32x limit, the vendor adds up to 4x ISP digital gain which does not act in this pipeline yet) - still ⚠️. Earlier (history): vendor AE per frame runs on the open driver (`enable_core_ops_cb=1`, the module line of the timps-t40-v2 bundle; default 0): zone mean 44 = target 44, converges 2-3 frames after the first allocation, IT on the anti-flicker ladder, no oops (`fable/t40-3a-perframe`, in next); 2026-10-19 the AE clamps IT and gains to the sensor limits like the OEM, 12/12 samples 19.9-20.4 fps under timps (was 11.6 fps, `claude/t40-ae-maxint`). Restrictions: the open gain is 4-5x higher than the vendor''s in the same scene (wiki changelog 2026-10-17, open); low light (gain instead of IT at the 2241 cap) not shown yet'
      issues:

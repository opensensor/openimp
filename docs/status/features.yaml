CreateChn` has no effect (vendor ipd 8: I QP 20.5 against 23.8 at ipd 0; the open CBR uses the exact hardware controller without an I/P delta), `iPBDelta`/`eRcOptions`/`uMaxPictureSize` are stored only, per-frame QP windows apply the union of the I and P windows, run-time changes apply immediately (vendor: at the next picture). Hence the cell stays ⚠️. Earlier (history): device-tested: min/max QP live and effective; quality_lvl/change_pos/i_bias restart-only (readback in video block) **Not rebuilt on purpose (user decision 2026-10-26, lowest priority):** the exact vendor P-path regime (`eRcOptions` / DELAYED) is not reproduced; the behaviour is functionally vendor-equal and scene-change recovery is faster than the vendor''s.'

- n: 44
  title: Encoder telemetry / diagnostics
  group: Stability, helper libraries, telemetry
  vendor: IMP_Encoder_Query/ChnStat
  cells:
    T10:
      sym: ✅+
      text: RC log line, clamp warning
    T20:
      sym: ✅+
      text: ditto
    T21:
      sym: ✅+
      text: ditto
    T23:
      sym: ✅+
      text: ditto
    T30:
      sym: '?'
      text: not documented
    T31:
      sym: ✅+
      text: '2026-10-27: `GetChnEvalInfo` returns the header layout of `IMPEncoderStreamInfo` (`iNumBytes` first, then the counters, QP at 28/30/32) instead of the vendor''s one-word-shifted bytes: beyond vendor, a deliberate ABI difference a streamer must not compensate for (AVC: iNumBytes 3993 of a 4003-byte access unit; JPEG: size and quality 75); apitest enc on the T31L camera PASS 122 / FAIL 0. Earlier: ditto'
    T32:
      sym: ❌
      text: no OpenIMP T32 build yet (the function would need one); no T32 hardware yet
    T33:
      sym: 📋
      text: 'planned, not started: no T33 driver, OpenIMP build or hardware yet (T33L test module ordered)'
    T40:
      sym: ✅
      text: 'Update 2026-10-24, evening: `Encoder_Query` `work_done`/`leftPics` follow the codec activity (busy in 17.5 % of the samples at 20 fps = 8.7 ms per frame, before always idle), `OpenIMP_Encoder_GetTelemetry` counts 139 frames = consumer count at 20.02 fps / 2099 kbit/s, `GetChnAveBitrate` 1920 against 2033 kbit/s measured. Older text: host (night 2026-10-12): `Encoder_Query` with the vendor 1.3.1 field semantics (`leftStreamBytes`/`curPacks` always 0, `leftStreamFrames` 1 while a finished stream waits for `GetStream`, `work_done`); OpenIMP encodes on demand, so `leftPics` is 0; `Encoder_GetChnEvalInfo`, `GetChnAveBitrate` exported, no test result'
    T41:
      sym: ✅
      text: '2026-10-24 on .34, beyond the vendor (OpenIMP next): `IMP_Encoder_Query` now reports real values (before: 397 samples in 4 s, all `leftPics=1`, `work_done=0` from the poll state, inert). After: `work_done` 0 in 192 of 496 samples (38.7 %), which matches the measured encode time (25.85 ms average, 66.7 ms maximum), `leftPics` mirrors it, a polled-not-fetched stream shows frames=1 / bytes=6873 / packs=1 and after `GetStream` 0. New beyond-vendor `OpenIMP_Encoder_GetTelemetry` (consumer-side counters: 75 frames / 1401684 bytes in 5 s = 15.02 fps, 2073 kbit/s). The T41 1.2.0 vendor SDK has only `Encoder_Query` with the 6-word `IMPEncoderChnStat`; `GetChnEvalInfo` and `GetChnAveBitrate` are not in the T41 headers. Not covered: queue depth (OpenIMP encodes on demand, there is no input queue), a stalled consumer shows 0, no vendor A/B (no vendor module/library at hand). The `t41_isr_counts` slots 36 and 52 stay 0 in the native build by design (2026-10-23); per-IRQ run times need the `TX_ISP_LOAD_STATS=y` build. Earlier (history): 2026-10-23: `t41_isr_counts` slots 36 and 52 stay 0 in the native build by design (the OEM frame-down callbacks are registered only in the lifted branch; the native LSC/BCSH paths write immediately), so these counters are no telemetry for the native build; per-IRQ run times need the `TX_ISP_LOAD_STATS=y` build (`t41_isr_us`, `t41_isr_max_us`). The T41 diagnostics branch `claude/t41-gaps` is not merged. Earlier (history): isp-m0 shows AE/AWB/anti-flicker/flip; encoder rc readback ok; query counters stayed 0 under load; other /proc/jz/isp nodes unreadable'
- n: 45
  title: Encoder ROI (region QP)
  group: Region of interest
  detail_group: Stability, helper libraries, telemetry
  vendor: '`IMP_Encoder_SetChnROI` (T10/T20/T21/T23), `IMP_Encoder_Set/GetChnRoiAttr` (T40/T41); no ROI API in the T31 library'
  cells:
    T10:
      sym: ✅
      text: 'regions on the Helix/NVPU, device-tested; absolute QPs are limited to the valid H.264 range; absolute ROI re-tested 2026-10-10: valid, no inversion'
    T20:
      sym: ✅
      text: 'regions and H.264 chroma QP offset, device-tested (QP 51 region blocky, QP 15 clean); valid H.264 from agg-34 (an absolute QP more than 25 from the macroblock QP broke hardware decoders before); absolute ROI re-tested 2026-10-10: valid, no inversion'
    T21:
      sym: ✅+
      text: 'effective by default (beyond vendor: the vendor never programs it), device-tested; relative QP acts inside -12/+13 of the slice QP; `OPENIMP_T21_ROI=0` switches it off'
    T23:
      sym: ✅
      text: 'on the native Helix encoder (default backend), the same registers the vendor 1.3.0 encoder programs; device-tested 2026-10-10: QP map shows the window (relative QP acts inside -12/+13 of the slice QP, like T21), bit rate +10 % at delta -15 and -4 % at +20/absolute 51, 9 streams valid in VA-API and strict ffmpeg; OPENIMP_T23_ROI=0 switches it off'
    T30:
      sym: '?'
      text: ROI calls (4 vendor names) exported, no test result for T30
    T31:
      sym: ✅+
      text: 'beyond vendor: `IMP_Encoder_Set/GetChnRoiAttr` through the AVPU macroblock QP table (H.264 only), device-tested: delta -10 gives 2.7x the bit rate, a relative -20 is clamped to -19, absolute 51 blurs the region, 0 decoder errors in 20 VA-API checks; 2026-10-10: 20 phases valid in VA-API and strict ffmpeg (`-err_detect`); known deviation: under FixQP 42 an absolute 5 or relative -25 window drives the P-frames to QP about 14 almost frame-wide (bit rate about x4, stream valid); `OPENIMP_T31_ROI=0` refuses the call'
    T32:
      sym: ❌
      text: no OpenIMP T32 build yet (the function would need one); no T32 hardware yet
    T33:
      sym: 📋
      text: 'planned, not started: no T33 driver, OpenIMP build or hardware yet (T33L test module ordered)'
    T40:
      sym: ✅
      text: '`Encoder_Get/SetChnRoiAttr` (10 windows, AVC only) through the same AVPU macroblock QP table as the T31 (one byte per 16x16 block in EP2, cmd[9] bits 25/24; the vendor 1.3.1 library builds the same one-byte table and sets the same bits); **on by default** since 2026-10-18 (`OPENIMP_T40_ROI=0` refuses the call); device-tested on the Eufy T40XP in FixQP and CBR (FixQP 32 window -20: 100 to 1194 kbit/s, CBR window +20 drops the window SSIM 0.96 to 0.89); `SetChnMapRoi` is still not exported on T40'
    T41:
      sym: ✅+
      text: '2026-10-24 ROI also works under FixQP (beyond the vendor: the vendor library shows no ROI effect under FixQP on T41, capture of libimp 1.2.6). Cause of the old limit: the vendor pins the QP range word EP2 header +0x10 (max<<24 | min<<16 | 0x302) to QP..QP under FixQP (0x1e1e0302 at QP 30) and the AVPU clamps every macroblock QP to it. `avpu_t41_roi_apply` opens the range to 0x33000302 while a window or map is active and restores the pinned word afterwards (the HWRC words are not needed). Device (.32, 1280x720 15 fps FixQP 30, window 384x240 at 448,240): window -20 raises P-frames from 222 to 2364 B and the bit rate from 431 to 977 kbit/s, window +20 gives window SSIM 0.79 against 0.93 away from it, whole frame -20 gives 19 Mbit/s, `SetChnMapRoi` -20 432 -> 1023 kbit/s and +20 window SSIM 0.75 against 0.98; ROI off restores the stream (IDR 84578 against 84573 B base). CBR/VBR: path unchanged, on by default (2026-10-18: whole frame -20 doubles the bit rate, a +20 window drops its SSIM 0.97 to 0.73; vendor CBR +20: window SSIM 0.84 against 0.98 away). `OPENIMP_T41_ROI=0` refuses the call. Not clean: an open-stack CBR re-run was confounded by a scene change and .32 rebooted once during a further CBR run while another job reloaded the module on the same camera (cause unknown). Earlier (history): `Encoder_Get/SetChnRoiAttr` (AVC) through the AVPU QP table with cmd[152] bits 0 and 3 as the vendor sets them; **on by default for CBR/VBR** (device-tested 2026-10-18 on Cinnado .34 and Vanhua .32: whole frame -20 doubles the bit rate, a +20 window drops its SSIM 0.97 to 0.73); (then) under FixQP the AVPU ignored the table (cause found 2026-10-24, see above); `OPENIMP_T41_ROI=0` refuses the call; `SetChnMapRoi` rides on the same switch (not device-tested)'
  extra: '- **Rules (all SoCs with ROI):** window deltas -25..+25; spread of all deltas at most 25; picture QP plus delta inside 0..51 and the rate control''s min/max QP; requests beyond that are clamped with a one-time warning (`SetChnRoiAttr` returns -1 for a delta outside -26..25 or an absolute QP outside 0..51)'

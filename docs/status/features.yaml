      - 133
      - 149
    T41:
      sym: ✅
      text: '2026-10-24 (third pass): the ''system CPU'' column of the A/B (/proc/stat delta, open 7.6 % against the vendor 2.2 % on .32) is **not comparable**: both kernels use `NO_HZ_FULL` + `VIRT_CPU_ACCOUNTING_GEN`, and the vendor ISP kernel thread `isp_fw_process` alone shows 8.8 % of one core in its stime while /proc/stat reports 0.6 % system time. Ground truth with one SCHED_IDLE spinner per CPU (free-CPU iterations, 20 s, stream running, same camera .32, same kernel image config): **open 23435 against vendor 22540, i.e. the open stack leaves about 4 % more CPU free** (idle baseline with the streamer stopped: open 25682, vendor 24254; the vendor module keeps working without a client). Open .34: 22216. The per-frame tone worker costs 2.9-3.3 ms (TMO map on MXU3 1.5-1.8 ms, ADR 0.8 ms), AWB 0.8-2.1 ms, ISR 0.27 ms per frame. Optional (not default) `t41_tmo_map_interval=2` + `t41_adr_interval=2` save about 1.1 ms per frame (about 2 % free CPU) with a static picture unchanged (SSIM 0.95, not tested in light steps). Limits: one series per stack, vendor and open runs 30 min apart. Earlier (history): 2026-10-24 A/B against the vendor stack (60 s windows, 4 windows on the open stack): timpsd 0.2 % against 0.3 %, but the system CPU on .32 is 7.6 % (windows 0.8-12 %, tick bursts) against 2.2 % for the vendor, on .34 5.3 % against 5.0 %; ISP interrupts are 25-45 % below the vendor (128-133 against 179 per s on .32, 133 against 231 on .34). The older timps figure (~10-12 % against ~27 % with the vendor libimp) is a user-space number only; the cell is lowered because the total system load on .32 is above the vendor. Earlier (history): timps ~10–12 % with our libimp vs ~27 % with the vendor libimp (momentary values)'

    T40:
      sym: ✅+
      text: 'Update 2026-10-24, evening (open-tx-isp `claude/t40-reload`, merged): reload and restart are clean now, the ''staying ⚠️'' reasons below are overtaken. The first unload oopsed in the frame-channel removal (a lifted `wake_up_all(NULL)`, the fault the vendor `tx_isp_t40` shows on rmmod and that QEMU reproduces); the frame source is now removed before the core, the objects the lift had turned into `kfree(NULL)` are freed, `/proc/jz/isp` and the sensor I2C client are released, the lifted `vmalloc` areas are freed at exit and the per-session leak (about 36 areas / 344 KB per streamer restart, the vendor frees them per session) is closed. Eufy T40 (.184, test module, then stock restored): 10 reloads, 10 `kill -9` + reload, 10 streamer restarts = 30/30 cycles, snapshot 200 every time, 0 oopses, unloaded `vmalloc` and kernel memory flat. ✅+ because the vendor module oopses on rmmod. Older text: 2026-10-24 reasons for staying ⚠️ (code audit, camera busy): the 10-10 oops (epc 0x6ef, module size 763904) was the VENDOR `tx_isp_t40`; the open module was rmmod-tested twice on 2026-10-13, exit steps 1-8 fine, step 10 (core platform device remove) took the SoC down (2nd time without watchdog recovery, power cycle) and it has not been rmmod-tested since. Current next: exit is split into 15 steps (`echo exit N > /proc/tx_isp_t40_recovered` for a bisect), the core remove skips `ispcore_slake_module` by default (`t40_rmmod_skip_slake=1`, untested) and `tisp_deinit` is skipped (`skip_tisp_deinit=1`, tisp allocations probably leak per load); `tx_isp_core_remove` has no NULL check of drvdata and both OEM kfree calls are `private_kfree(NULL)`. Next: per-step bisect with the flight recorder when the Eufy is free (needs power-cycle permission). Status before: the stop/start path (second `S95timps start` after the bind fix) is clean. Earlier (history): 2026-10-24: after the bind fix a second `S95timps start` on the same boot is clean (no oops), agg43c, 2026-10-24. Earlier (history): 2026-10-18: 10/10 ch0+ch1 stop/start cycles after the OEM release reset on the last `/dev/tx-isp` close (`claude/t40-restart-hang`, 181/181 frames each), 5 client reconnects, 0 oops (T40_RESTART_HANG_1018); rmmod/insmod cycles are not run (the test state is a reboot between runs); MemFree drifts about -0.5 MB over 10 sessions (open)'
    T41:
      sym: ✅+
      text: '2026-10-24 on .34 (Cinnado sc5336, image agg4x, open-tx-isp next `2c29ce79`), all in ONE boot (uptime 1:38 at the end): 31 module unload/load cycles (10 after a normal streamer stop, 10 with `t41_heap_watch=1 t41_heap_decoys=32`, 10 after `kill -9` of the streamer without DelSensor) plus 10 streamer stop/start and 8 kill -9 restarts = 49 cycles, every snapshot 200, 0 oops, 0 hangs, 0 heap-watch/decoy hits (the 10-12 build hit a decoy in 10 of 50 cycles), the `bad vinum` / `csi init invalid` guards never fired; unloaded vmalloc 26 entries flat, MemFree with no trend, SUnreclaim +3 kB/cycle without diagnostics (noise), sensor i2c client gone after every unload, module refcount 0, streamer RSS 2.9-3.7 MB flat. Beyond the vendor: the vendor `tx-isp-t41` leaks the `tisp_top` page at every stream start and keeps a stale sensor i2c client after a streamer crash; the open driver frees the page (`tisp_deinit`) and releases the client on unload or before the next register. Caveat: the writer of the 10-12 heap overwrite is not named, only its two possible paths are closed (`688ba69a`, `67200912`, `57449bdb`). Earlier (history): 2026-10-23 RC2 run on .32 (gc5603): one module reload (streamer stopped, `rmmod` sensor + `tx_isp`, `insmod` with the image defaults) rc 0, CLKGR as after boot, streaming and snapshot fine, then 9 reboots in total (6 + 3), back in 27-32 s each, snapshot 200 after 40 s, 0 oops. The 17-cycle module-parameter heap bug (#2 below) was not re-run, so the cell stays ⚠️. Earlier (history): rev2 image: 10/10 rmmod/insmod cycles OK, refcnt 0, 0 oops; kill -9 of the streamer recovers 3/3; the boot oops (kthread_stop -EINTR, use-after-free of `isp_fw_process`) is fixed (`claude/t41-boot-oops`, 2026-10-17). Open: the module-parameter heap overwrite across reloads (oops in the 17th load/unload cycle, 2026-10-12; named again as "rmmod heap bug" in the 2026-10-19 size audit)'

# Implementation status of OpenIMP / open-tx-isp per feature and SoC.
# Source of truth for the hand-written part of docs/FEATURE_MATRIX.md (generated, do not edit it).
# Cell: sym = status symbol (see legend), text = detail text of the cell (markdown, newest result first),
# issues = public GitHub issue numbers (Lu-Fi/openimp), evidence = optional refs (commit, report, test run).
# Validate: python3 tools/status_data.py --check   Regenerate: python3 tools/gen_feature_matrix_html.py
title: 'Open stack vs vendor stack: feature matrix'
socs:
- T10
- T20
- T21
- T23
- T30
- T31
- T32
- T33
- T40
- T41
legend:
- '✅ supported: works, matches vendor behaviour, tested or backed by the changelog'
- '✅+ improved beyond vendor: more robust, leaner or more functional than the vendor stack'
- '⚠️ known defect / deviation: runs, but with a known defect or a deviation from the vendor'
- '🔧 in progress: branch is running or a test is pending'
- '📋 planned: deliberately scheduled, not started yet (mostly low priority)'
- '❌ missing: not implemented'
- '— hardware does not have it: not applicable'
- '? unknown: not documented in the sources, deliberately not guessed'
- '[-all-13]: historic tag (tested before the later aggregates); everything so tagged is contained in `next`'
details_intro: 'Per feature: the vendor-stack behaviour and the full per-SoC cell text (chronological test log, newest results win).'

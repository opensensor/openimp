      text: '2026-10-31 (image agg60: all #140 batches incl. 19 sensor/WDR ioctl sites and 2 AE sites): apitest all areas plus 28 cases PASS 270 / FAIL 0, 0 oopses, 0 `unresolved jalr`, the lost-argument counters (`cnt_core_ops_init`, `cnt_sec_init`, `cnt_main_long_tgain_update`) stay 0, raw ioctl probe ok. #88 (reset while inserting a temporary test build) closed as not reproducible. Earlier: 2026-10-27: test image of the 2026-10-27 merges (#81, #83, #86; the driver in `next` is identical): T40 camera stable for more than 2 h, no oops, AF statistics flow, day/night round trip clean. The last 36 lines of lifted code that addressed fixed offsets of the OEM .bss layout now use the OEM objects (host chains identical before and after, 0 differences). Earlier: RC2 (2026-10-24 22:45 to 2026-10-25 10:00): overnight soak of the Eufy .184 (agg43e: open-tx-isp e5030fd4, OpenIMP f55f620f; ~10.8 h, snapshots always 200, 0 oops, no streamer restart, VMalloc flat; `audit/logs1024/soak-agg4z.log`), the first overnight soak of the T40 stack; the RC2 fleet image agg46 runs the same code line. Known remaining items below stay open but did not occur. Earlier: ⚠️ 2026-10-24: the boot-time oops of agg43b (bind, #1) is fixed; the Eufy ran the whole A/B session (open stack, 0 oops, unchanged PID). The agg43 fleet soak of 2026-10-23 did not include the Eufy (no network until the WLAN fix), so there is still no overnight soak of the T40 stack. Earlier (history): open driver: 300 s regression and 10-min ch0+ch1 timps runs clean, 10/10 restart cycles (2026-10-18), the oops at every day/night thread start fixed 2026-10-19 (AWB statistics); no overnight soak with the current stack. Open: MemFree about -0.5 MB over 10 sessions; aicwf-SDIO "rxbuff list is empty" storms with hangs in about half of the runs on 2026-10-17 (suspected memory pressure, not closed in the TODO)'

    T40:
      sym: ✅
      text: '2026-10-31 (Eufy T40, #133 and #149 closed): the open stack is vendor-like on CPU. ISP busy 1.6 % against 1.4 % for the vendor (#133); encoder load of the same encload binary 0.71 % against 0.77 / 0.84 % for the vendor (#149); the blocking DQBUF option `t40_dqbuf_wait_ms` stays at its default 0 because it is not needed. Earlier: 2026-10-30 (Eufy T40, same encload binary on both stacks, H.264 1080p20 CBR 2 Mbit/s GOP 40, frames dropped, 60 s, 20.0 fps): encload user process open 0.90 % (day) / 0.93 % (night) vs vendor 0.77 / 0.84 %, after the 1 ms polling loop of the T40 frame wait was removed (frame_source_wait 34 -> 1 per frame, encoder_poll 2269 -> 615 us/frame; it was 2.67 / 2.72 % before, #149); ISP kernel threads 2.2-3.0 % open vs 3.55-3.57 % vendor; idle encoder (no stream): open 0.6 % vs vendor 1.4 % busy. Open: blocking DQBUF in open-tx-isp for full parity (#149 part 2), same polling path on T31/T41 not checked. Earlier: 2026-10-27: #81: the ISP event thread sleeps until an event is queued (about 20 wake-ups per second instead of a 1 ms poll; QEMU 50 -> 1, state D -> S), the load average is no longer pinned at 1. The per-frame cost of the translated vendor AWB in that thread (about 30 ms CPU per frame, 60 % of one core at 20 fps) is only partly fixed: #133 (C ct_detect, merged) brings it from about 35 to about 27 ms CPU per frame in day mode on the Eufy, still far above the vendor (the per-frame vendor AWB/ADR chain); ⚠️ until it is vendor-like. Earlier: timpsd about 5.4-6.2 % of one core with a ch1 client on the Eufy (open driver, motion off/on, 2026-10-18); vendor comparison not measured'

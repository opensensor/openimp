    T41:
      sym: ✅
      text: '2026-10-27: AE tuning API of the vendor 1.2.6 library (#90): `Set/GetFaceAe`, `Set/GetAeExpList`, and `GetAeStatistics`/`histThresh` report what the vendor AE computes; T41 camera (sc5336, runtime swap): 256-bin sum = width x height, 5-bin split equals the 256 bins over the current and a changed histThresh, face window target 40 vs 180 moves the frame Y 88.4 vs 105.8 (base 98.2), AeExpList on/off reads back; 0 guard faults, 0 oops. AeSpeed is not in the T41 vendor API. Earlier: A/B against the vendor stack on the same camera and scene, 2026-10-24 (light 255 -> 100 -> 255, one run per stack, deltas below 5 % are noise): `claude/t41-ab-fixes3` (now in next) settles in 33.1 / 31.2 s on .32 and 33.3 s on .34 against the vendor 34.0 / 34.2 s and 33.4 s, the final exposure/gain pairs are identical to the vendor, the luma step is 136 -> 111 against the vendor 135 -> 111 (before the EV-unit fix the open stack held 103 -> 99 at a 24 % darker picture), the peak EV during the dark step was 45-63 % below the vendor in the first run (agg4t). Earlier (history): the vendor AE (63 functions translated from the SDK `tx-isp-t41.ko` H20250310a) runs per frame and is the default since 2026-10-19 (`t41_vendor_ae=1`): .32 gc5603 converges in about 1 s, .34 sc5336 light off 0.4 s, light on 1.8-2.5 s, 0 guard faults (2026-10-18); 16.6 h soak clean. Before: the frozen-exposure bug of the safe AE (duplicate knot in the sc5336 bin) fixed 2026-10-17'

      text: '2026-10-31: #93 closed with camera proof (long-term evidence for the AE-zone stack fix). The cell stays ⚠️ because #94 (T31L watchdog reset after 52 h without a kernel trace) is open and unexplained; the diagnostic that keeps the last panic record in the RTC scratch register (survives a reset) is proven on the T31L and the T31X. Earlier: RC2 (2026-10-25): stays ⚠️: the .33 hung on the old agg43 image and the multi-day run of the .29 on the current code ends on 2026-10-29. Update 2026-10-24, evening: the reboot of 2026-10-17 was analysed from the log host: a fault inside the slab allocator during a fork, preceded by ''scheduling while atomic'', then no further kernel output; it is the only unexplained reboot of that camera in 4.7 days, no other BUG in all logs since 09-25. Likely a kernel stack overflow on the fork/page-fault stack; one contribution of ours (the AWB statistics hard IRQ copied 225 AE zones = 900 B onto the stack) is removed. Cause not proven; the cell turns ✅ after a clean run of at least 5 days with this driver. Older text: 2026-10-22/23: `.26` ran 22 h with the picture fix clean (no restart, luma 75-121 day/night) and the agg43 fleet soak (23.10., 18.4 h, 111 rounds) had 0 restarts, 0 oops and snapshots always 200 on every T31 camera; the Wintergarten reboot analysis stays open. Earlier (history): 4.5 h soak ok; 2026-10-06: H.264 stall after JPEG teardown fixed (5c2ccef, agg-29). 2026-10-17: the Wintergarten T31 rebooted after 4.7 days with a preempt-count underflow (suspected IRQ stack overflow, analysis in T31_ATOMIC_1017; fix patch untested, `motor.ko` also suspected)'

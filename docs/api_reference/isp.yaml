# Descriptions for the ISP API pages (tools/gen_api_wiki.py -> wiki page API-ISP).
# Own words only; the vendor documentation is read for understanding, never copied.
title: ISP (including ISP tuning)
intro: |
  The ISP module opens the image signal processor, registers the camera sensor and exposes the tuning interface:
  exposure, white balance, colour, noise reduction, flip, crop, day/night and the statistics the ISP collects. The
  calls named `IMP_ISP_Tuning_*` change the picture while the stream runs; they only work between `EnableTuning` and
  `DisableTuning`.

  **Typical start-up order:** `IMP_ISP_Open`, `IMP_ISP_AddSensor`, `IMP_ISP_EnableSensor`, `IMP_System_Init`, create and
  enable the FrameSource channels, `IMP_ISP_EnableTuning`, then the tuning calls. Shut down in reverse order:
  `DisableTuning`, `DisableSensor`, `DelSensor`, `IMP_ISP_Close`.

  Many calls exist twice in the vendor library family: a plain form and a `_Sec` form (and `ISP_MultiCamera_` prefix) for
  the second sensor of a dual-sensor SoC (T23, and T40 and T41 with their own `_VI` forms). The second-sensor forms are
  not described separately; they take the same arguments.

  **Signatures differ between SoC families.** The declarations on this page are those of the OpenIMP header, which follows
  the T10 to T31 form. On T40 and T41 most tuning calls take the video input (`IMPVI_NUM num`, normally `IMPVI_MAIN`) as an
  extra first argument, and the one-byte picture controls (brightness, contrast, sharpness, saturation, hue) take a pointer
  to the value; check the vendor header of the SoC you build for. On T10 to T31 a failed call returns -1; T40 and T41
  return their own negative codes for some failures (for example -4 for a video input number that is out of range).
  On T10 to T31 every `Tuning` call made outside the `EnableTuning` / `DisableTuning` window returns -1.
groups:
  - id: life
    title: Open, sensor and tuning session
  - id: ae
    title: Exposure (AE)
    intro: The auto exposure chooses integration time and gains to reach a brightness target. These calls read what it chose, limit it, or take it over.
  - id: awb
    title: White balance (AWB)
  - id: color
    title: Colour, contrast and sharpness
    intro: Simple picture controls. Brightness, contrast, saturation and sharpness are one byte; 128 is the default and the byte goes unchanged to the ISP driver (above 128 increases the effect, below decreases it).
  - id: nr
    title: Noise reduction, defog and dynamic range
  - id: dn
    title: Day/night, scene and running mode
  - id: flip
    title: Flip, crop and zoom
  - id: wdr
    title: Wide dynamic range
  - id: af
    title: Autofocus statistics
  - id: stat
    title: Statistics and reading the ISP state
  - id: osd
    title: OSD, masks and drawing
    intro: Overlays that the ISP or the mscaler draws into the picture. The software OSD of the `IMP_OSD` module is the usual choice; these calls are the lower level used on some SoCs.
  - id: ldc
    title: Lens correction, bypass and raw
  - id: sys
    title: Board hooks and internals
    intro: GPIO, camera input selection and helper entries of the vendor library that are exported for binary compatibility. Applications seldom call them.
functions:
  ISP_Open:
    group: life
    summary: "Opens the ISP device (`/dev/tx-isp`, on T20 `/dev/v4l-subdev0`). Has to be the first ISP call."
    returns: "0 on success, -1 if the device cannot be opened (driver not loaded). On T40 and T41 a second call while the device is open returns 0."
    see_also: [ISP_Close]
  ISP_Close:
    group: life
    summary: "Closes the ISP device. The sensor has to be disabled and deleted first."
    notes: "On T40 and T41 the call returns -1 while a sensor is still added or enabled or while tuning is enabled."
    see_also: [ISP_Open]
  ISP_AddSensor:
    group: life
    summary: "Registers a sensor with the ISP driver and selects it. The `IMPSensorInfo` structure names the sensor and its control bus."
    params:
      pinfo: "Sensor description (`IMPSensorInfo`), with the sensor name that the driver knows (for example `gc2053`). On T40 and T41 the first argument is the video input (`IMPVI_NUM`, normally `IMPVI_MAIN`)."
    returns: "0 on success, -1 on a NULL argument, when the ISP device is not open, when a sensor is already running (call `DisableSensor` first), when the driver refuses the registration, or when no sensor of that name is known to the driver. On T40 and T41 a second `AddSensor` without `DelSensor` also returns -1."
    notes: "The sensor driver module has to be loaded first. Dual-sensor SoCs also have `IMP_ISP_AddSensor_VI(vi, pinfo)` for the second input."
    see_also: [ISP_EnableSensor, ISP_DelSensor]
  ISP_DelSensor:
    group: life
    summary: "Unregisters the sensor from the ISP driver and releases the buffers the library kept for it. The sensor has to be disabled first."
    returns: "0 on success. -1 on T10 to T31 when the ISP is not open or the sensor is still enabled, and when the driver refuses the request (the driver's result is returned). On T40 and T41 -1 for a video input out of range, a NULL pointer, when no sensor is registered, or while it is enabled."
    notes: "On T40 the call only deselects the input, since the sensor kernel module owns the sensor device; on T41 it also releases the sensor I2C client, so a new sensor can be registered without reloading the module."
    see_also: [ISP_AddSensor]
  ISP_EnableSensor:
    group: life
    summary: "Starts the registered sensor and links it into the ISP data path."
    returns: "0 on success. -1 on T10 to T31 when the ISP is not open, no sensor was registered, or a driver request fails. On T40 and T41 -1 for a video input out of range, a NULL pointer, when no sensor is registered or a driver request fails; calling it on an enabled sensor returns 0."
    notes: "Do it before `IMP_System_Init`, as in the typical order above. The `_VI` form selects the sensor input on dual-sensor SoCs."
    see_also: [ISP_DisableSensor]
  ISP_DisableSensor:
    group: life
    summary: "Stops the sensor and unlinks it from the ISP data path."
    returns: "0 on success. -1 on T10 to T31 when the ISP is not open, no sensor was selected, or a driver request fails. On T40 and T41 -1 for a video input out of range or a failing driver request; calling it when the sensor is not enabled returns 0."
    see_also: [ISP_EnableSensor]
  ISP_EnableTuning:
    group: life
    summary: Starts the tuning session, which allows all `IMP_ISP_Tuning_*` calls.
    notes: "The vendor samples call it after the FrameSource channels are enabled. On T10 to T31 every tuning call made before it returns -1."
    see_also: [ISP_DisableTuning]
  ISP_DisableTuning:
    group: life
    summary: Ends the tuning session.
  ISP_Tuning_Get/SetSensorFPS:
    group: life
    summary: "Sets or reads the frame rate of the sensor as a fraction (numerator and denominator, each packed into 16 bits for the driver)."
    params:
      fps_num: "Numerator, for example 25. At most 65535."
      fps_den: "Denominator, for example 1. Must not be 0."
    returns: "0 on success, -1 for a zero denominator or a NULL pointer. The setter on T40 and T41 also refuses a video input other than the main one and values above 65535. T10 to T31 also return -1 outside the tuning session, except T23, whose frame-rate calls do not check it."
    notes: "On T40 and T41 the arguments are the video input and, on T41, a frame-rate structure (on T40 two pointers) instead of two integers. On T23 the call also retimes the frame source to the new rate. Except on T23 the getter returns the last known rate even when the driver request fails. The sensor driver decides whether it rounds the value to a rate it supports, so read the value back."
    see_also: [FrameSource_Get/SetChnAttr]
  ISP_Tuning_GetSensorAttr:
    group: life
    summary: "Reads the sensor timing into `IMPISPSENSORAttr`: horizontal and vertical total size (`hts`, `vts`), frame rate and picture width and height (20 bytes)."
    returns: "0 on success, -1 for a NULL pointer. On T31 a driver without the call leaves the structure zero except for `fps`, which then holds the last rate set with `SetSensorFPS`; on T23 the driver's answer is copied unchanged, and T40 and T41 pass the structure to the driver."
    notes: "Only on T23, T31, T40 and T41."
  ISP_Tuning_SetVideoDrop:
    group: life
    summary: "Installs a callback that the library calls when the stream has stalled: no frame for 2 seconds, then again after 4 and 6 seconds (at most three times in a row, a new count starts when frames return)."
    params:
      cb: "Callback without arguments (`void (*)(void)`); use it to restart the stream or to reboot the camera. Pass NULL to remove it."
    returns: "0 on success, -1 if tuning is not enabled or the monitor thread cannot start."
    notes: "OpenIMP counts the frames its FrameSource hands out, and only while a channel is streaming and has a reader; a stream that was stopped on purpose is not reported. The callback runs in a library thread."
  ISP_Tuning_WaitFrame:
    group: stat
    summary: "Blocks until the ISP has finished a frame or the timeout has expired, and reports the frame-done counter."
    params:
      attr: "`timeout` (in, milliseconds) and `cnt` (out, 64-bit count of finished frames; also filled after a timeout on T20 and T21)."
    returns: "0 on success, non-zero (-1) on timeout or error."
  ISP_Tuning_WaitFrameDone:
    group: stat
    summary: "Waits for the next frame-done event of the sensor `num` and returns the frame counter and interrupt type of that event (T40 and T41)."
    returns: "0 on success, -1 for a NULL attribute or an invalid sensor number. On T41 a timeout returns -1 with `errno` set to ETIMEDOUT and leaves the structure unchanged; the vendor driver returns 0 on a timeout and the caller has to compare the counter."
    notes: "The first word of the attribute is the timeout. The wait happens outside the library lock, so other ISP calls are not blocked meanwhile."
  ISP_Tuning_Get/SetExpr:
    group: ae
    summary: "Reads the exposure mode and integration time in use, or sets them. `IMPISPExpr` is a union: the setter uses `s_attr` (mode, unit line or microsecond, time) and the getter fills `g_attr` (mode, current, minimum and maximum integration time, microseconds per line)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "A manual mode setting stops the auto exposure; set the mode back to auto to resume. The structure carries no gain fields; limit the gain with `SetMaxAgain` / `SetMaxDgain`. Clamping of the time is done by the driver."
    see_also: [ISP_Tuning_GetEVAttr, ISP_Tuning_Get/SetAeComp]
  ISP_Tuning_GetEVAttr:
    group: ae
    summary: "Reads the exposure state into `IMPISPEVAttr`, an array of six 32-bit values filled by the driver. The meaning of the values is the driver's."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session. On T23 the 24 bytes are copied out even when the driver request failed."
    notes: "Use it for telemetry; to see how bright the scene is, read `GetTotalGain` or `GetAeLuma`."
  ISP_Tuning_Get/SetAeComp:
    group: ae
    summary: Moves the brightness target of the auto exposure up or down (exposure compensation).
    params:
      comp: "Compensation. The vendor library recommends 0 to 255; 128 is the default. Higher values give a brighter picture. Measured picture brightness for comp 0, 128 and 255: 56, 105 and 245 on T20, 55, 100 and 160 on T31."
    notes: "The AE reacts slowly: on T31 allow about 30 seconds after a change. The vendor T40 and T41 libraries have no `AeComp` call; there the same effect is the `AeTargetComp` field of `Get/SetAeScenceAttr` (0 to 255, 128 neutral)."
  ISP_Tuning_Get/SetMaxAgain:
    group: ae
    summary: "Sets or reads the ceiling of the analogue gain the auto exposure may use."
    params:
      gain: "Ceiling in the gain unit of the ISP driver; the library passes the value on unchanged. 0 means no ceiling and 1 the smallest ceiling (1x) in the sensor-hold code of OpenIMP."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session; otherwise the driver's result. A failed getter stores 0 in the output."
    notes: "Lowering it reduces noise in the dark at the price of a darker picture or longer integration time. The ceiling only binds while the auto exposure runs."
  ISP_Tuning_Get/SetMaxDgain:
    group: ae
    summary: "Sets or reads the ceiling of the digital gain the auto exposure may use."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session; otherwise the driver's result. A failed getter stores 0 in the output."
    see_also: [ISP_Tuning_Get/SetMaxAgain]
  ISP_Tuning_Get/SetBacklightComp:
    group: ae
    summary: "Sets or reads the strength of backlight compensation."
    params:
      strength: "Strength; the library passes it on unchanged, the range is the driver's."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31. A driver that does not support the control makes the call fail instead of being accepted without effect."
  ISP_Tuning_Get/SetHiLightDepress:
    group: ae
    summary: "Sets or reads how strongly very bright areas are held down."
    params:
      strength: "Strength; the library passes it on unchanged, the range is the driver's."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session; otherwise the driver's result."
  ISP_Tuning_Get/SetAntiFlickerAttr:
    group: ae
    summary: Selects the mains-flicker avoidance of the exposure control.
    params:
      attr: "On T10 to T31: `IMPISP_ANTIFLICKER_DISABLE` (0), `IMPISP_ANTIFLICKER_50HZ` (1) or `IMPISP_ANTIFLICKER_60HZ` (2), passed by value; other values return -1. On T40 and T41: the video input and a pointer to a structure with `mode` and `freq`."
    notes: "Set it to the frequency of the local mains so the integration time is a multiple of the light period; with the wrong value the picture shows moving bands."
  ISP_Tuning_Get/SetIntegrationTime:
    group: ae
    summary: "Sets or reads the exposure integration time of the legacy interface, either as a fixed value or as an upper limit for the auto exposure."
    params:
      itattr: "Structure with the mode (0 auto, 1 manual, 2 limit), the integration time and the maximum integration time."
    returns: "0 on success, -1 for a NULL pointer, a mode other than 0 to 2, or outside the tuning session. On T20 and T21 a manual integration time of 256 or more is refused with -1."
    notes: "Mode 1 fixes the integration time; mode 2 sets the maximum the auto exposure may use; mode 0 returns to auto. The getter reports mode 1 for a fixed time, 0 otherwise. Only on T10, T20, T21 and T30; newer SoCs use `SetExpr`."
  ISP_Tuning_Get/SetAeAttr:
    group: ae
    summary: "Reads or changes the AE attribute block in one structure."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31. The library converts between the public structure and the layout the driver uses; the meaning of the values is the driver's."
  ISP_Tuning_Get/SetAeExprInfo:
    group: ae
    summary: 'Reads or sets the AE exposure parameter block (`IMPISPAEExprInfo`: `AeMode`, `AeIntegrationTime`, `AeAGain`,
      `AeDGain`, `AeIspDGain`).'
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T40 and T41. OpenIMP''s own test-pattern
      hold reads the block, sets `AeMode` to manual to pin the exposure while a pattern is shown and writes the saved block
      back afterwards.'
  ISP_Tuning_Get/SetAeScenceAttr:
    group: ae
    summary: Reads or sets the AE scene attributes of `IMPISPAEScenceAttr`.
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T40 and T41 (the ISP spells it `Scence`).
      Get and Set are device-tested on T40 against the vendor library.'
  ISP_Tuning_Get/SetAeSpeed:
    group: ae
    summary: Reads or sets how fast the auto exposure converges (`IMPISPAeSpeedAttr`).
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: 0 on success; -1 for a bad video input number or NULL, otherwise the driver's result.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x800009a. T40 only: the
      T41 vendor API has no AeSpeed.'
    soc: T40 only.
  ISP_Tuning_Get/SetAeConvergeStep:
    group: ae
    summary: Reads or sets the AE convergence step block.
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000028. T41 only.'
    diff: On T41 the open driver stores the block and returns it; the AE does not use it yet.
    soc: T41 only.
  ISP_Tuning_Get/SetAeStrategy:
    group: ae
    summary: Chooses how the AE splits a change between integration time and gain (`IMPISPAeStrategy`).
    params:
      strategy: '`IMPISPAeStrategy` (value, not a pointer).'
    returns: 0 on success, -1 outside the tuning window or for a NULL output; otherwise the driver's result.
    notes: Value control 0x8000022 of the ISP driver, as in the vendor T20, T21 and T30 libraries. T10, T20 and T21 are device-tested;
      T30 was tested on the host with a fake ioctl.
    soc: T10, T20, T21, T30.
  ISP_Tuning_Get/SetAeMin:
    group: ae
    summary: "Sets or reads the lower limit of the exposure (minimum integration time and gain) for the auto exposure."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Only on T21, T23 and T31."
  ISP_Tuning_Get/SetAeTargetList:
    group: ae
    summary: "Sets or reads the table (10 values, `IMPISPAETargetList`) that maps total gain to the AE brightness target, so the target can fall in the dark."
    returns: "0 on success. -1 for a NULL pointer on T31 and T10 to T30, and on T31 also outside the tuning session or on a driver failure."
    notes: "Only on T23 and T31. On T31 the table reaches the driver. In the T-series library code for the other SoCs (T10 to T30) the table is only kept in memory and read back."
  ISP_Tuning_Get/SetAeWeight:
    group: ae
    summary: "Sets or reads the metering weights of the AE grid; zones with a higher weight count more."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. On T40 and T41 -1 for a video input out of range or NULL (the first argument is the video input)."
    notes: "The grid size and weight range are defined by the driver."
  ISP_Tuning_Get/SetAeHist:
    group: ae
    summary: "Reads or sets the histogram parameters of the AE (bin thresholds and weights)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Not on T40 and T41."
  ISP_Tuning_Get/SetAeExpList:
    group: ae
    summary: Reads or sets the AE exposure list (a mode switch plus a list of exposure steps; in list mode the AE allocates
      exposure from the list).
    params:
      num: Video input (`IMPVI_MAIN`).
      attr: '`IMPISPAeExpListAttr` (324 bytes on T41).'
    returns: 0 on success; -1 for a bad video input number or NULL, otherwise the driver's result.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T41: control 0x8000027, served by
      the open driver from the vendor AE; on a camera list mode on and off, read-back, and refusal of an invalid mode were
      checked with the calibration''s own list. T40: control 0x8000099, host-tested only.'
    soc: T40 (host-tested) and T41.
  ISP_Tuning_AE_Get/SetROI:
    group: ae
    summary: "Sets or reads a region of interest for the exposure metering."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "On T20 the 4-byte region is handed to the driver by value instead of through a pointer. Not on T40 and T41."
  ISP_Tuning_GetAE_IT_MAX:
    group: ae
    summary: "Reads the upper limit of the AE integration time."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. A failed read stores 0 in the output."
    notes: "Only on T23 and T31."
  ISP_Tuning_SetAe_IT_MAX:
    group: ae
    summary: "Sets the upper limit of the AE integration time. A short limit reduces motion blur and makes the auto exposure raise gain instead."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31. On the other T-series SoCs use `SetIntegrationTime` in mode 2."
  ISP_Tuning_SetAeFreeze:
    group: ae
    summary: "Freezes the current exposure (non-zero) or releases it (zero)."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31 (the T20 and T21 drivers have no freeze). OpenIMP's own hold for test patterns uses gain ceilings and a manual integration time instead, because those work on every driver."
  ISP_Tuning_GetAeLuma:
    group: stat
    summary: "Reads the mean luma of the picture as seen by the AE."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. A failed read stores 0 in the output."
    notes: "Only on T21, T23 and T31."
  ISP_Tuning_GetAeState:
    group: stat
    summary: "Reads the state block of the AE into the structure you pass (whether the exposure has settled); the layout is defined by the driver."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31."
  ISP_Tuning_GetAeZone:
    group: stat
    summary: "Reads the per-zone luma values of the AE grid."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    diff: "Not served by the stock T10/T20 kernel module, so on T10 and T20 the call is a no-op that returns success."
  ISP_Tuning_GetAeHist_Origin:
    group: stat
    summary: "Reads the unprocessed AE histogram."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31."
  ISP_Tuning_GetAeStatistics:
    group: stat
    summary: 'Reads the AE statistics: a 256-bin histogram, the 5-bin split derived from `histThresh` and the zone data.'
    params:
      num: Video input (`IMPVI_MAIN`).
      ae_statis: '`IMPISPAEStatisInfo`.'
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T40 and T41. On T41 the open driver
      computes the values with the vendor AE since issue 90: the 256 bins add up to width times height, and the 5-bin split
      follows `histThresh` of `SetStatisConfig`.'
  ISP_Tuning_GetAEEvList:
    group: stat
    summary: Reads the AE EV list (same call as `GetAeEvList`; the vendor header spells it `GetAEEvList`, the library exports
      `GetAeEvList`).
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000038. T41 only.'
    soc: T41 only.
    see_also:
    - ISP_Tuning_GetAeEvList
  ISP_Tuning_GetAeEvList:
    group: stat
    summary: Reads the AE EV list (the exported spelling; `GetAEEvList` is the same function).
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000038. T41 only.'
    soc: T41 only.
    see_also:
    - ISP_Tuning_GetAEEvList
  ISP_Tuning_GetAeAtList:
    group: stat
    summary: Reads the AE AT list.
    params:
      num: Video input (`IMPVI_MAIN`).
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000039. T41 only.'
    soc: T41 only.
  ISP_Tuning_Get/SetWB:
    group: awb
    summary: "Reads or sets the white balance mode and, for manual mode, the red and blue gains."
    params:
      wb: "`IMPISPWB`: `mode` (`IMPISP_WB_MODE_AUTO` or `IMPISP_WB_MODE_MANUAL`; the driver's other white-balance preset values pass through unchanged), `rgain` and `bgain`."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Manual mode needs the gains in the structure; auto mode ignores them. OpenIMP's own hold for test patterns switches to manual mode with the gains read from `GetWB_Statis` and restores the previous setting afterwards."
    see_also: [ISP_Tuning_GetWB_Statis]
  ISP_Tuning_GetWB_Statis:
    group: awb
    summary: "Reads the colour temperature and gains that the AWB currently uses."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. Only `rgain` and `bgain` are written (unpacked from one 32-bit word); `mode` is left alone."
  ISP_Tuning_GetWB_GOL_Statis:
    group: awb
    summary: "Reads the global AWB statistics (mean R, G, B of the picture)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. Only `rgain` and `bgain` are written (unpacked from one 32-bit word); `mode` is left alone."
  ISP_Tuning_SetWB_ALGO:
    group: awb
    summary: Selects the AWB algorithm variant with a value (0 to 2 on T23).
    params:
      mode: Algorithm number, passed to the driver as the control value.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: 'T23 and T31; the value goes to the driver as the control value. T31: the driver handler exists (static audit only,
      no device test). T23: the open driver accepts the call like the stock module (modes 0 to 2 stored, always 0) but the
      call has no effect on the picture, which is why the matrix lists it as a known limitation; host build only so far.'
  ISP_Tuning_Get/SetAwbAttr:
    group: awb
    summary: Reads or sets the AWB attribute block of `IMPISPWBAttr` (T40, T41), including the freeze switch `awb_frz` and
      the colour temperature `ct`.
    returns: 'T40/T41 form: first argument is the video input (`IMPVI_MAIN`); the return value is the driver''s result, -1
      for a bad input number or NULL.'
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. OpenIMP''s own test-pattern hold
      sets `awb_frz` to freeze the AWB and writes the saved block back afterwards. T40 is device-tested; T41 reviewed against
      the code only.'
    soc: T40 and T41.
  ISP_Tuning_Get/SetAwbWeight:
    group: awb
    summary: "Sets or reads the weights of the AWB zones."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. On T40 and T41 the first argument is the video input; an invalid input or NULL gives -1."
    notes: "On T23 and T31 the stock driver treats this as a no-op, and OpenIMP matches that."
  ISP_Tuning_Get/SetAwbZoneWeight:
    group: awb
    summary: Reads or sets the AWB zone weight table (T23).
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: T23 only; the table is passed to the driver unchanged (round trip tested only, the effect needs the open driver's
      AWB). NULL is refused by the library.
    soc: T23 only.
  ISP_Tuning_Get/SetAwbHist:
    group: awb
    summary: "Reads or sets the AWB histogram parameters."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "A no-op on T23 and T31, like the stock driver."
  ISP_Tuning_Get/SetAwbClust:
    group: awb
    summary: Reads or sets the AWB cluster table. The block goes to the ISP driver unchanged (pointer argument, vendor layout).
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: Only T23 and T31 have this call. On T23 the open ISP driver's AWB reads the cluster and trend tables like the stock
      module (emulator-identical); the Set/Get round trip is device-tested, the effect on the picture only on the host and
      in the emulator.
    see_also:
    - ISP_Tuning_Get/SetAwbCtTrend
  ISP_Tuning_Get/SetAwbCtTrend:
    group: awb
    summary: Reads or sets the AWB colour-temperature trend table. The block goes to the ISP driver unchanged (pointer argument,
      vendor layout).
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: 'Only T23 and T31. On T23 the library does not check for NULL itself; the driver result is returned. Effect on
      the picture: see `AwbClust`.'
    see_also:
    - ISP_Tuning_Get/SetAwbClust
  ISP_Tuning_Get/SetAwbCtTrendOffset:
    group: awb
    summary: Reads or sets an offset block for the colour-temperature trend (28 bytes).
    returns: 'T40/T41 form: first argument is the video input (`IMPVI_MAIN`); the return value is the driver''s result, -1
      for a bad input number or NULL.'
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000015. T41 only.'
    soc: T41 only.
  ISP_Tuning_Get/SetAwbConvergeStep:
    group: awb
    summary: Reads or sets the AWB convergence step block.
    returns: 'T40/T41 form: first argument is the video input (`IMPVI_MAIN`); the return value is the driver''s result, -1
      for a bad input number or NULL.'
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000016, vendor 1.2.6 layout.
      T41 only.'
    soc: T41 only.
  ISP_Tuning_GetAWBCt:
    group: awb
    summary: Reads the colour temperature the AWB currently uses.
    params:
      ct: Pointer to a 32-bit value; the ISP driver stores the colour temperature through it.
    returns: 0 on success. -1 for a NULL pointer or outside the tuning window; otherwise the driver's result.
    notes: Only T23 and T31. The pointer itself travels in the request (the driver writes through it), the same way as the
      stock T31 library does.
  ISP_Tuning_SetAwbCt:
    group: awb
    summary: Hands a colour-temperature block to the AWB through the driver control; the argument is a pointer, not a number.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: Only T23 and T31. Checked on the device as an API round trip only; no visible effect has been verified. On T23
      the library does not check for NULL itself.
  ISP_Tuning_Awb_Get/SetRgbCoefft:
    group: awb
    summary: "Reads or sets the red, green and blue correction coefficients of the white balance."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
  ISP_Tuning_Awb_Get/SetCwfShift:
    group: awb
    summary: Reads or sets the cool-white-fluorescent shift of the AWB as red and blue gains.
    params:
      isp_wb_attr: '`IMPISPWB`: `rgain` and `bgain` only.'
    returns: 0 on success, -1 for NULL or outside the tuning window; otherwise the driver's result.
    notes: Both gains travel in one 32-bit control value (`rgain << 16 | bgain`, control 0x8000001); the driver stores them
      in the light-source calibration of the current day or night bank. T10, T20 and T30 only.
    soc: T10, T20, T30.
  ISP_Tuning_AwbSync:
    group: awb
    summary: "Has the kernel synchronise the AWB of sensor 1 to sensor 0 (dual-sensor boards)."
    returns: "0 on success; sensors 0 and 2 and above return 0 without any request; the driver error otherwise."
    notes: "Only sensor 1 is synchronised."
  ISP_Tuning_GetAwbZone:
    group: stat
    summary: "Reads the per-zone white balance statistics (`IMPISPAWBZone`: 225 red, 225 green and 225 blue values, 15 by 15 zones)."
    returns: "0 on success, -1 for a NULL pointer, outside the tuning session, or when the driver has no statistics frame of the running stream; the call then does not return a zero-filled or stale block."
  ISP_Tuning_GetAwbGlobalStatistics:
    group: stat
    summary: Reads the global AWB statistics block (`IMPISPAWBGlobalStatisInfo`).
    returns: 'T40/T41 form: first argument is the video input (`IMPVI_MAIN`); the return value is the driver''s result, -1
      for a bad input number or NULL.'
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T40 and T41.'
    soc: T40 and T41.
  ISP_Tuning_GetAwbStatistics:
    group: stat
    summary: 'Reads the per-zone AWB statistics: three 15x15 planes of 32-bit zone means (raw R, G and B before white balance),
      2700 bytes in all.'
    params:
      num: Video input (`IMPVI_MAIN`).
      awb_statis: '`IMPISPAWBStatisInfo`; the planes are in the order R, G, B (`awb_g` at offset 900, `awb_b` at 1800).'
    returns: 0 only if the block holds statistics. A driver error, or a block that is all zero, returns -1 with `errno` `EAGAIN`
      (no frame measured yet, or on T41 the last statistics are older than one second), so a consumer never takes zeros or
      a stale copy for a measurement.
    notes: T40 and T41 only. The symbol `OpenIMP_Cap_AwbStatistics` (int, 1) exists in a library that has this contract; a
      streamer can look it up with `dlsym` before relying on it. On T41 the open ISP driver is required for statistics from
      the running stream; the vendor T40 kernel driver copies its state regardless, which is all zero before the first statistics
      frame.
  ISP_Tuning_Get/SetBcshHue:
    group: color
    summary: "Sets or reads the hue rotation (one byte)."
    params:
      hue: "Hue byte. On T40 and T41 a pointer to the byte, after the video input."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. On T40 the codes are -4 (video input out of range), -9 (NULL pointer), -5 (tuning not running) and -6 (driver refused); the T40 getter returns the byte cached by the last set (128 before any set) and does not ask the driver. T41 takes only the main input and returns -1 otherwise."
    notes: "On T40 the driver maps the byte 0 to 255 onto a hue angle of 0 to 120 degrees."
  ISP_Tuning_Get/SetContrast:
    group: color
    summary: "Sets or reads the contrast, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte, and the getter returns the value the application set last (it does not read the driver)."
  ISP_Tuning_Get/SetSaturation:
    group: color
    summary: "Sets or reads the colour saturation, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver; below 128 reduces the colour. On T40 and T41 the call takes the video input and a pointer to the byte, and the getter returns the value the application set last."
  ISP_Tuning_SetBrightness:
    group: color
    summary: "Sets the brightness, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte."
    diff: On T21 the value scales the AE target by value/128, so brightness acts through the exposure control (beyond the vendor, whose T21 call changes nothing).
  ISP_Tuning_GetBrightness:
    group: color
    summary: "Reads the brightness value."
    notes: "On T40 and T41 the getter returns the value the application set last (default 128) and does not read the driver."
    diff: The T40 getter returned -1 in the RC1 test; it now returns the per-input cached value like the vendor library.
  ISP_Tuning_SetSharpness:
    group: color
    summary: "Sets the sharpness, one byte, 128 is the default."
    notes: "The byte goes unchanged to the ISP driver. On T40 and T41 the call takes the video input and a pointer to the byte."
    diff: On T21 and one other SoC the value has no visible effect in our tests, as with the vendor library.
  ISP_Tuning_GetSharpness:
    group: color
    summary: "Reads the sharpness value."
    notes: "On T40 and T41 the getter returns the value the application set last (default 128)."
  ISP_Tuning_Get/SetColorfxMode:
    group: color
    summary: 'Selects a colour effect: auto (normal), black and white, sepia, negative or vivid.'
    params:
      mode: '`IMPISP_COLORFX_MODE_AUTO` (0), `_BW` (1), `_SEPIA` (2), `_NEGATIVE` (3) or `_VIVID` (9).'
    returns: '0 on success, -1 for a NULL pointer or outside the tuning window; otherwise the driver''s result. On T30 the
      call only exists as a stub that returns -1 (one message on stderr: not supported on this SoC).'
    notes: Implemented as a V4L2 control of the ISP video device on T10, T20, T21 (and T31 in the library build); T23 has
      its own V4L2 path. Not present in the T40 and T41 libraries. Black and white, negative and vivid change the picture
      on T21 (checked with the image-effect test).
    diff: Sepia works on T21 although the vendor library has no effect there.
  ISP_Tuning_Get/SetGamma:
    group: color
    summary: "Sets or reads the gamma curve table."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "A curve that falls anywhere is rejected. On T23 the new curve is applied at once."
    diff: "Applied at once on T23, where the stock behaviour is to wait."
  ISP_Tuning_Get/SetGammaAttr:
    group: color
    summary: 'Reads or sets the gamma block: curve type plus a 129-entry table.'
    params:
      num: Video input (`IMPVI_MAIN`).
      attr: '`IMPISPGammaAttr` (`Curve_type` and the table).'
    returns: 0 on success. Set returns -1 for a NULL pointer or a `Curve_type` that is not below `IMP_ISP_GAMMA_CURVE_BUTT`
      (4) before any driver call; Get passes the driver's result (-1 for NULL or a bad input number).
    notes: T40 and T41. The table is passed to the driver as it is. On T40 the Get is device-tested; the Set was tested on
      the host only. On T41 the error handling follows the vendor 1.2.6 library, not device-tested.
  ISP_Tuning_Get/SetCCMAttr:
    group: color
    summary: Reads or sets the colour correction matrix (3x3 floats) with the manual-mode and saturation switches.
    params:
      attr: '`IMPISPCCMAttr`: `ManualEn`, `SatEn`, `ColorMatrix[9]`.'
    returns: 0 on success, -1 for a NULL pointer (T23, T31, T40, T41) or outside the tuning window; otherwise the driver's
      result.
    notes: 'On T23, T31, T40 and T41 the library converts between the floats and the 40-byte driver block, as the vendor library
      does: byte 0 manual, byte 1 saturation, then nine words, each a sign bit plus 13 bits in steps of 1/1024 (so values
      outside about -8 to 8 are cut, and resolution is 1/1024). On T23 the Set also replaces negative coefficients by their
      absolute value in your structure (vendor behaviour); the other SoCs leave your structure alone. Not available on T10,
      T20, T21, T30. Device status: T40 Get tested, T41 round trip, T23 and T31 reviewed against the code only.'
  ISP_Tuning_Get/SetCsc_Attr:
    group: color
    summary: Reads or sets the colour space conversion (RGB to YUV) block. The block goes to the ISP driver unchanged (pointer
      argument, vendor layout).
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: Only T23 and T31 (device-tested on T31, round trip on T23).
  ISP_Tuning_Get/SetISPCSCAttr:
    group: color
    summary: 'Reads or sets the colour space conversion (RGB to YUV) of T40 and T41: a colour gamut preset or a user matrix.'
    params:
      csc: '`IMPISPCSCAttr`: `ColorGamut` and, for the user gamut, the matrix `CscCoef[9]`, offsets and clip values.'
    returns: 0 on success; -1 for a bad input number, NULL, a gamut value that is not valid, or the driver's failure.
    notes: 'The library converts between the public floating-point matrix and the driver block (T41: 92 bytes, coefficients
      in 1/65536 steps; T40: 64 bytes, coefficients in 1/1024 steps), as the vendor library does. T40 is device-tested; the
      T41 error handling follows the vendor 1.2.6 library and has not been tested on a camera.'
    soc: T40 and T41.
  ISP_Get/SetCsccrMode:
    group: color
    summary: "Reads or sets the mode of the chroma conversion stage (a T41 vendor call)."
    returns: "Not applicable."
    notes: "Not provided by OpenIMP on any SoC. The matrix lists it as a gap on T41."
    soc: "Vendor T41 only; missing in OpenIMP."
  ISP_Tuning_Get/SetModule_Ratio:
    group: color
    summary: "Reads or sets how strongly individual ISP blocks work, as a ratio."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      attr: "`IMPISPModuleRatioAttr`."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through: the public structure goes to the ISP driver unchanged. On T41 the open driver applies the strengths of the 2D and 3D noise reduction, the dynamic range compression and the dead pixel correction; other fields are ignored there."
    soc: "T40 and T41."
  ISP_Tuning_Get/SetModuleControl:
    group: color
    summary: "Switches individual ISP processing blocks on or off (bypass bits)."
    params:
      ispmodule: "Bit field with one bit per processing block (`IMPISPModuleCtl`)."
    returns: "0 on success, -1 for a NULL pointer; on T31 also when the driver refuses the request."
    notes: "On T23 and T31 the mask goes to the driver. On T21 the driver request is tried and a refusal is ignored, the value being kept. On T20 the mask is only kept in the library and read back. Only the module bits the driver knows have an effect."
  ISP_Tuning_SetDPStrength:
    group: nr
    summary: Sets the strength of the dead pixel correction in percent.
    params:
      ratio: 0 to 200 (percent; larger values are cut to 200).
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: The percentage is scaled to the driver's 0 to 255 range (percent times 128 / 100, rounded, at most 255) and sent
      as control 0x8000062 with the value inline. The return code is tested on T10, T20 and T21; the effect on the picture
      has not been measured. On T30 only the host test with a fake ioctl exists.
    soc: T10, T20, T21, T30.
  ISP_Tuning_Get/SetDPC_Strength:
    group: nr
    summary: "Sets or reads the strength of the dead pixel correction, as a percentage."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
  ISP_Tuning_Get/SetDRC_Strength:
    group: nr
    summary: "Sets or reads the strength of the dynamic range compression (it brings out dark areas)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "On T20 the strength is limited to 255; if the driver refuses the ratio control, the call falls back to the strength field of the DRC attribute block."
  ISP_Tuning_EnableDRC:
    group: nr
    summary: Switches the dynamic range compression (ADR) block on or off.
    params:
      mode: '`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`.'
    returns: 0 on success; on T31 and T23 the driver's failure (-1) is returned. On the other SoCs where the symbol exists
      the value is only remembered in the library.
    notes: 'Reaches the driver on T31 and T23 only (T31: control 0x80000a3 with the mode inline).'
    soc: T23 and T31.
  ISP_Tuning_Get/SetRawDRC:
    group: nr
    summary: 'Reads or sets the DRC attributes of the raw stage: mode and, for manual mode, the strength.'
    params:
      attribute: '`IMPISPDrcAttr`: `mode` (`IMPISP_DRC_MANUAL`, `_UNLIMIT`, `_HIGH`, `_MEDIUM`, `_LOW`, `_DISABLE`, `_RANGE`)
        and `drc_strength`.'
    returns: 0 on success, -1 for a NULL pointer or when the tuning session is not running (T10, T20); otherwise the driver's
      result.
    notes: T10, T20 and T21 send the mode and (in manual mode) the strength to the driver, and skip a call whose value equals
      the last one sent. On T10 and T20 the library keeps the strength in the shared tuning table and returns it from there.
      On T30 the attribute is only checked (mode must not exceed `IMPISP_DRC_DISABLE`) and remembered in the library; nothing
      reaches the hardware. On T21 the image-effect test showed no picture change.
  ISP_Tuning_Get/SetDefog_Strength:
    group: nr
    summary: "Sets or reads the defog strength."
    params:
      ratio: "Pointer to the strength byte (the setter takes the pointer too)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session (T10 to T31); otherwise the driver's result."
    notes: "On T40 and T41 the call is an OpenIMP extension of the single-argument form: 0 to 255, 128 neutral, applied through the module ratio of the ISP firmware (the vendor's own defog strength call is a stub there), main sensor only; the getter returns 128 while the unit is not enabled."
  ISP_Tuning_EnableDefog:
    group: nr
    summary: Switches defog on or off.
    params:
      enable: 1 switches on, 0 off.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: Only T23 and T31; the flag is passed to the driver as the control value.
    diff: Takes the enable flag like the vendor library; an earlier OpenIMP stub always switched it on.
  ISP_Tuning_SetAntiFogAttr:
    group: nr
    summary: "Sets the anti-fog level: 0 off, 1 strong, 2 medium, 3 weak."
    returns: "0 on success, -1 without an open tuning session, otherwise the driver result; the T10 and T20 driver rejects levels above 3."
    notes: "Accepted, no picture change on T21 in our tests, as with the vendor library."
  ISP_Tuning_Get/SetSinterDnsAttr:
    group: nr
    summary: 'Reads or sets the spatial (2D, Sinter) noise reduction: auto or manual mode and the strength.'
    params:
      attribute: '`IMPISPSinterDenoiseAttr`: `type` (auto or manual), `sinter_strength`; on T10 and T20 also a range form
        (`sval_max`, `sval_min`).'
    returns: 0 on success; -1 for a NULL pointer or, on T10 and T20, a tuning session that is not ready, or `sval_max` below
      `sval_min`; otherwise the driver's result.
    notes: T10 and T20 write the setting into the driver's shared tuning table; T21 sends a prepared block through a driver
      control. On Get the library fills the attribute even when the driver call failed (as the vendor does). On T30 the value
      is only remembered in the library. Not available on T23, T31, T40, T41.
  ISP_Tuning_Get/SetTemperDnsAttr:
    group: nr
    summary: 'Reads or sets the temporal (3D, Temper) noise reduction: auto or manual mode and the strength.'
    params:
      attribute: '`IMPISPTemperDenoiseAttr`: `type` (`IMPISP_TEMPER_DISABLE`, `_AUTO`, `_MANUAL`, `_RANGE`) and `temper_strength`.'
    returns: 0 on success; -1 for a NULL pointer or, on T10 and T20, a tuning session that is not ready; otherwise the driver's
      result.
    notes: T10 and T20 write into the shared tuning table; the Set is ignored (returns 0) while the ISP runs in night mode.
      T21 uses driver controls and remembers the last values. On T30 the value is only remembered in the library. Not available
      on T23, T31, T40, T41.
  ISP_Tuning_SetTemperDnsCtl:
    group: nr
    summary: "Run-time control of the temporal noise reduction: a type and, for the manual type, a strength."
    returns: "0 on success, -1 for NULL or no tuning session, otherwise the driver result."
    notes: "T20: ignored while the ISP runs in night mode (returns 0); the type and the manual strength are sent only when they changed. T30: the value is only kept, no driver control is written. T21 sends the control to the driver."
  ISP_Tuning_SetSinterStrength:
    group: nr
    summary: "Sets the strength of the spatial (2D) noise reduction as a ratio; 128 is the neutral value."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result."
    notes: "On T21 the strength is converted to the sinter block of the driver. On T20 it is scaled to a percentage of the table (capped at 200 percent). The vendor library uses a different driver control there."
  ISP_Tuning_SetTemperStrength:
    group: nr
    summary: "Sets the strength of the temporal (3D) noise reduction as a ratio; 128 is the neutral value."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result."
    notes: "On T20 the strength is scaled to a percentage of the table (capped at 200 percent) and the getter returns the last value set."
  ISP_Tuning_SetMeshShadingScale:
    group: nr
    summary: Selects the scale of the lens shading (mesh shading) correction.
    params:
      scale: '`IMPISPMeshShadingScale`, passed to the driver as the control value.'
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: Control 0x80000a3, which writes the scale field of the shading register in the open driver. T10 is device-tested;
      T20 only on the host. Not in the other vendor APIs.
    soc: T10 and T20.
  ISP_Tuning_Get/SetISPRunningMode:
    group: dn
    summary: "Switches the ISP between day mode and night mode, or reads the mode."
    params:
      mode: "`IMPISP_RUNNING_MODE_DAY` (0) or `IMPISP_RUNNING_MODE_NIGHT` (1). On T40 and T41 a pointer to the mode, after the video input."
    returns: "0 on success. -1 for a NULL pointer or outside the tuning session (T10 to T31, except T23, which does not check the session); otherwise the driver's result. On T40: -4 for a video input out of range or a mode outside the vendor range, -9 for NULL, -5 when tuning is not running on the getter, -6 when the driver refuses the getter. T41 takes only the main input."
    notes: "The library does not switch the IR-cut filter or the IR LEDs; the application drives them. On T20 and T21 a successful switch re-applies brightness, contrast and saturation for the new mode. On T23 the call restarts the frame source change wait."
    see_also: [ISP_Tuning_Get/SetSceneMode]
  ISP_Tuning_Get/SetISPCustomMode:
    group: dn
    summary: Switches the ISP to a custom parameter bank (T23, T31) and reads the state back.
    params:
      mode: '`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`.'
    returns: 0 on success; -1 for a NULL pointer or a failed driver call. A failed Get leaves the output untouched.
    notes: T31 sends the mode to the driver (control 0x80000e7), which swaps parameter banks; Set only needs an opened tuning
      device, not the running tuning session. On T10, T20 and T21 the call does not exist in the vendor API; their crop is
      separate.
  ISP_Tuning_Get/SetSceneMode:
    group: dn
    summary: "Selects a scene preset (auto, indoor, outdoor and so on)."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result."
    diff: "The vendor T21 kernel module ignores the call; OpenIMP matches that."
  ISP_Tuning_SetFWFreeze:
    group: dn
    summary: "Sends the firmware-freeze flag (1 or 0) to the ISP driver as a tuning control."
    returns: "0 on success, -1 when the tuning session is not open, otherwise the driver result."
    notes: "On T23 a value equal to the last one is not sent again. T20 and T21 use the older control interface for the same control."
  ISP_Tuning_SetISPProcess:
    group: dn
    summary: "Sends the ISP-process flag to the ISP driver as a tuning control."
    returns: "0 on success, -1 when the tuning session is not open, otherwise the driver result."
    notes: "On T23 a value equal to the last one is not sent again. T20 and T21 pass the argument as the control value, the other SoCs pass a pointer to it."
  ISP_Tuning_EnableMovestate:
    group: dn
    summary: "Tells the ISP that the camera is moving. It loads the moving-scene limits from `/etc/sensor/<sensor>move.txt` into the exposure control."
    notes: "The stock T31 driver ignores the control, so there the visible effects are a key-frame request on channel 0 and the return value (-1 without tuning, otherwise 0). On T10 and T20 the driver applies the block (shorter integration time, manual 2D noise reduction while moving)."
  ISP_Tuning_DisableMovestate:
    group: dn
    summary: 'Ends the moving state: the exposure block captured by `EnableMovestate` is sent back (if the running mode has
      not changed) and a key frame is requested on encoder channel 0.'
    returns: 0 on success, -1 outside the tuning window.
    notes: T10, T20 and T31 run the vendor library logic (captured block of control 0x800002c, the limits from `move.txt`
      in `/etc/sensor/`, key frame on disable). On T21 and T30 the call writes only 0 to the movestate control (no key frame).
      On T23 the library does the same as T31, but the stock driver does nothing with it.
  ISP_StartNightMode:
    group: dn
    summary: "Starts the sensor in night mode: call it after `IMP_ISP_Open` and before `IMP_ISP_AddSensor`, so the first frames already use the night settings."
    params:
      num: "Sensor number, below 4."
    returns: "0 on success; -4 for a sensor number of 4 or more; -8 when the ISP device is not open; -1 when the driver call fails."
    soc: "T40 only; missing on T41."
  ISP_Tuning_Get/SetHVFLIP:
    group: flip
    summary: "Sets or reads the horizontal and vertical flip as one value (normal, horizontal, vertical, both)."
    params:
      hvflip: "`IMPISP_FLIP_NORMAL_MODE` (0), `_H_MODE` (1), `_V_MODE` (2) or `_HV_MODE` (3). On T23 a value above 3 is refused. On T40 and T41 a pointer to the value after the video input."
    returns: "0 on success, -1 outside the tuning session; otherwise the driver's result. T23 refuses a value above 3 with -1. On T40: -4 (video input out of range or mode out of range), -9 (NULL), -5 (tuning not running), -6 (driver refused)."
    notes: "On T10 to T31 the horizontal and vertical bits are set through two separate driver controls. On T40 the getter returns the mode cached by the last set (0 before any set), because the driver has no getter."
  ISP_Tuning_GetHVFlip:
    group: flip
    summary: "Reads the combined flip; the same call as `GetHVFLIP` under the spelling of the newer library."
    returns: "0 on success, -1 for a NULL pointer; on T10 to T31 also outside the tuning session or when a driver read fails. On T40 the video input is checked (-4) and the cached value of the last set is returned (-9 for NULL)."
  ISP_Tuning_Get/SetISPHflip:
    group: flip
    summary: "Sets or reads the horizontal mirror of the ISP output."
    params:
      mode: "`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session (T10 to T31, except T23); otherwise the driver's result."
    notes: "On T23 every set restarts the frame source change wait."
  ISP_Tuning_Get/SetISPVflip:
    group: flip
    summary: "Sets or reads the vertical flip of the ISP output."
    params:
      mode: "`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`."
    returns: "0 on success, -1 for a NULL pointer (getter) or outside the tuning session (T10 to T31, except T23); otherwise the driver's result."
    notes: "On T23 every set restarts the frame source change wait."
  ISP_Tuning_Get/SetISPHVflip:
    group: flip
    summary: "Sets or reads the horizontal and the vertical ISP flip in one call."
    params:
      hmode: "`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE` for the horizontal flip."
      vmode: "The same for the vertical flip."
    returns: "0 on success; the first failing result of the two single flips (for example -1 outside the tuning session); -1 for a NULL pointer (Get)."
    notes: "The library applies the two flips one after the other, as `SetISPHflip` followed by `SetISPVflip` (Get the same way), because the control the vendor library uses for the pair is not served by the open drivers."
    soc: "T10, T20 and T30."
  ISP_Tuning_Get/SetSensorHflip:
    group: flip
    summary: "Sets or reads the horizontal flip done by the sensor itself."
    params:
      mode: "Flip on or off; Get returns it through a pointer."
    returns: "0 on success; -1 outside the tuning session or for a NULL pointer (Get); otherwise the driver's result, or -4090 when the driver call fails."
    notes: "Set restarts the frame source change wait, like the ISP flip calls. The `MultiCamera_` form takes a sensor number below 3 (a larger number gives -4092). If the driver call fails, Get leaves the preset 0 in the result."
    soc: "T23 only."
  ISP_Tuning_Get/SetSensorVflip:
    group: flip
    summary: "Sets or reads the vertical flip done by the sensor itself."
    params:
      mode: "Flip on or off; Get returns it through a pointer."
    returns: "0 on success; -1 outside the tuning session or for a NULL pointer (Get); otherwise the driver's result, or -4090 when the driver call fails."
    notes: "Same behaviour as `SetSensorHflip`."
    soc: "T23 only."
  ISP_Tuning_Get/SetFrontCrop:
    group: flip
    summary: "Crops the picture at the ISP input, before scaling, so a smaller window of the sensor is used."
    params:
      ispfrontcrop: "Enable flag, position and size of the window."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "Only on T23 and T31."
  ISP_Tuning_SetAutoZoom:
    group: flip
    summary: "Sets a crop window and scaler output for a smooth digital zoom (auto zoom)."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
  ISP_Tuning_GetAutoZoom:
    group: flip
    summary: "Reads the auto zoom window set with `SetAutoZoom`."
    returns: "0 on success; -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. T40 and T41: -1 for a bad video input number or NULL."
    notes: "The structure goes to the driver and back unchanged. T40 and T41 take the video input as first argument."
    soc: "T23, T40 and T41."
  ISP_Tuning_SetScalerLv:
    group: flip
    summary: Passes a scaler-level block to the ISP driver.
    returns: 'T31 (and T23): the driver''s result; -1 outside the tuning window or for NULL (T31). T40, T41: the driver''s
      result; -1 for a bad video input number or NULL.'
    notes: On T23 the stock driver has no handler for this control and answers an error; OpenIMP matches that. On T41 the
      open driver handles the control (set only); older drivers had no handler and the call failed with an error.
  ISP_SetScalerLv:
    group: flip
    summary: T40/T41 name of the scaler-level call, without `Tuning`; sends the same driver control as `ISP_Tuning_SetScalerLv`.
    returns: The driver's result; -1 for a bad video input number or NULL.
    soc: T40 (host-tested only).
  ISP_Tuning_Get/SetWDRAttr:
    group: wdr
    summary: "Switches the wide dynamic range processing on or off, or reads the state."
    params:
      mode: "`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`."
    returns: "0 on success; -1 outside the tuning session or for a NULL pointer (Get); otherwise the driver's result."
    notes: "The library remembers the last mode. Set returns 0 without a driver call when the mode is unchanged, and a failing Get hands back the remembered mode together with the driver's error. On T10 and T20 the driver refuses the switch without a WDR frame buffer."
    soc: "T10, T20 and T30."
  ISP_Tuning_Get/SetWdrOutputMode:
    group: wdr
    summary: "Chooses how the WDR frame is delivered (fusion in the ISP or the long/short frames)."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      attr: "`IMPISPWdrOutputMode`."
    returns: "0 on success; -1 for NULL; on T40 also -1 for a bad video input number and the driver's result otherwise."
    diff: "On T41 the open driver refuses the control. The library then still returns 0: Set stores the value and Get reads it back (0 until something is set), like the vendor library, which accepts the call without an effect."
    soc: "T40 and T41."
  ISP_Tuning_Get/SetWdr_OutputMode:
    group: wdr
    summary: Reads or sets the WDR output mode with the older spelling of `WdrOutputMode`; the 4-byte value goes to the driver
      unchanged.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: T31 only. The call reaches the WDR tool block; a round trip is device-tested, not the effect on the picture.
  ISP_WDR_ENABLE:
    group: wdr
    summary: "Switches the wide dynamic range mode of the ISP on (1) or off (0)."
    params:
      mode: "T31: the integer 0 or 1. T40 and T41: a pointer to the mode after the video input (main input only)."
    returns: "0 on success. -1 when the ISP is not open or the driver refuses; on T40 and T41 also for a NULL pointer or an input other than the main one. A value other than 0 and 1 is accepted without effect."
    notes: "The library remembers the last mode, and the matching getter (`ISP_WDR_ENABLE_GET` on T40 and T41) answers from that memory without asking the driver."
  ISP_WDR_ENABLE_GET:
    group: wdr
    summary: "Reads the WDR mode the library last set."
    returns: "0 on success, -1 for a NULL pointer or an input other than the main one (T40 and T41)."
  ISP_WDR_ENABLE_Get:
    group: wdr
    summary: "Reads whether WDR is on (0 or 1) from the mode the library keeps."
    returns: "0 on success, -1 for a NULL pointer or an ISP that is not open."
    notes: "If the library holds a mode other than 0 or 1 it logs the fact and leaves the result unchanged."
  ISP_WDR_OPEN:
    group: wdr
    summary: "Opens the WDR path (T40 and T41 form with a sensor number). For the linear running mode the sensor and input mode go to the driver; for the WDR running mode WDR is enabled in the driver."
    returns: "0 on success, -8 for a NULL attribute or when the ISP is not open, -1 when the driver refuses, -9 for another running mode."
  ISP_Tuning_Get/SetAfHist:
    group: af
    summary: "Reads or sets the AF histogram parameters."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result."
    notes: "The AF statistics chain is off by default on T23."
  ISP_Tuning_Get/SetAfWeight:
    group: af
    summary: "Sets or reads the weights of the AF zones."
    returns: "0 on success, -1 for a NULL pointer or outside the tuning session; otherwise the driver's result. On T40 and T41 the first argument is the video input and an invalid input or NULL gives -1."
  ISP_Tuning_GetAFMetrices:
    group: af
    summary: Reads the AF metrics block of the ISP.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: T21, T23 and T31. The block layout is the vendor's and is not interpreted by the library. On T23 the open ISP driver
      now collects AF statistics by default; on T31 metrics, zone, weight and histogram reads were checked on a camera.
  ISP_Tuning_GetAFMetricesInfo:
    group: af
    summary: "Reads the AF metrics information block."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      metric: "`IMPISPAFMetricsInfo`."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through: the block goes to the ISP driver unchanged and its layout is not interpreted by the library."
    soc: "T40; missing on T41."
  ISP_Tuning_GetAfStatistics:
    group: af
    summary: "Reads the AF statistics."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      info: "`IMPISPAFStatisInfo`."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through, as `GetAFMetricesInfo`."
    soc: "T40; missing on T41."
  ISP_Tuning_GetAfZone:
    group: af
    summary: Reads the AF value of each zone.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: T23 and T31. See `GetAFMetrices` for the AF statistics source.
  ISP_Tuning_SetAFThreshold:
    group: af
    summary: "Sets the AF threshold."
    params:
      threshold: "New threshold; only the low 16 bits are kept."
    returns: "0 on success; -1 outside the tuning session."
    notes: "OpenIMP has no AF algorithm on T30 that would use the value, so it is only stored."
    soc: "T30 only."
  ISP_Tuning_GetTotalGain:
    group: stat
    summary: "Reads the total gain (analogue and digital together) used by the exposure."
    returns: "0 on success, -1 for a NULL pointer or when the ISP or its tuning object does not exist; otherwise the driver's result."
    notes: "On T23 the call does not check the tuning session and stores the value only on success. On T20 the driver writes the value through an address that the library passes in the request."
  ISP_Tuning_Get/SetStatisConfig:
    group: stat
    summary: Reads or sets the statistics configuration (72-byte `IMPISPStatisConfig`, among others the AE histogram thresholds
      `histThresh`).
    params:
      num: Video input (`IMPVI_MAIN`).
      statis_config: '`IMPISPStatisConfig`.'
    returns: The driver's result; -1 for a bad video input number or NULL.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000000, same on T40 and
      T41. On T41 the open driver applies the thresholds to the AE statistics (device test: split changed with `histThresh`,
      original restored).'
  ISP_Tuning_Get/SetTmoCurve:
    group: nr
    summary: "Reads or sets the tone mapping curve."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      attr: "The tone mapping curve block."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through: the block goes to the ISP driver unchanged."
    soc: "T41 only."
  ISP_Tuning_GetBlcAttr:
    group: color
    summary: Reads the black level correction attributes.
    returns: 0 on success. -1 for a NULL pointer or outside the `EnableTuning` / `DisableTuning` window; otherwise the driver's
      result.
    notes: T23 and T31. The stock T23 driver has no black-level control, so T23 returns an error there. Checked on T31 with
      the API test.
  ISP_Tuning_Get/SetMask:
    group: osd
    summary: 'Sets or reads the privacy mask: up to 3 channels with 4 rectangles each, filled with a colour.'
    returns: '0 on success. -1 for a NULL pointer or when the ISP tuning is not running; otherwise the driver''s result (T40:
      -4 bad video input, -9 NULL, -6 failed ioctl).'
    notes: A mask given in RGB is converted to YUV in your structure before it is sent (T31, T40 and T23, as the vendor does),
      so a Get returns the YUV colour. T40 keeps a copy of the structure in the library and merges the fields the driver does
      not return into the Get. The stock T23 driver does not handle this control, so on T23 the calls fail; use `SetMaskBlock`
      there. Not in the T41 vendor API, which has `SetMaskBlock` instead.
  ISP_Tuning_SetMaskBlock:
    group: osd
    summary: Sets one mask block (position, size, colour, channel, picture number) with the block table of the newer SoCs.
    params:
      num: Video input (`IMPVI_MAIN`); T23 has no such argument in the single-sensor form.
    returns: 'T41: -1 for a bad video input or NULL, otherwise the driver''s result. T23: -4090 if the driver ioctl fails.'
    notes: 'An enabled RGB mask is converted to YUV in your structure first. The library also remembers the block at slot
      `chx * pinum`, as the vendor library does (an odd index choice that is kept). T23: the open driver stores the block;
      the stored masks have no visible effect yet because the scaler update that consumes them is not run. T41: the open driver
      handles the control (window and colour are stored and programmed at the next output start; Get always reports the block as
      disabled, as the vendor driver does).'
  ISP_Tuning_GetMaskBlock:
    group: osd
    summary: "Reads one mask block of the mask block table."
    params:
      num: "Video input (`IMPVI_MAIN`); T23 has no such argument in the single-sensor form."
      mask: "`IMPISPMaskBlockAttr`; set `chx` and `pinum` before the call."
    returns: "T41: -1 for a bad video input or NULL, otherwise the driver's result. T23: -4090 if the driver ioctl fails."
    notes: "After the driver call the library puts back the mask type and the colour that `SetMaskBlock` remembered for slot `chx * pinum`, because the driver does not return them. The driver reports the block as disabled on T41, as the vendor driver does."
    soc: "T23 and T41."
  ISP_Tuning_Get/SetDrawBlock:
    group: osd
    summary: "Reads or sets one block of the table the ISP draws (rectangles and lines)."
    params:
      draw: "The draw block: type, channel, picture number and the configuration with colour."
    returns: "-4090 if the driver ioctl fails; otherwise 0. There is no NULL check."
    notes: "Set converts an RGB colour of an enabled block of the first three types to YUV in your structure and remembers it; Get puts the remembered colour type and colour back. Whether the running driver serves the control depends on its version: check the matrix cell."
    soc: "T23 only; missing on T41."
  ISP_Get/SetDrawAttr:
    group: osd
    summary: "Reads or sets the drawing attributes of the ISP: the 896-byte table of lines, ranges and windows (2 channels of 16 units)."
    params:
      num: "Sensor number, below 4."
      attr: "`IMPISPDrawAttr`."
    returns: "0 on success; -4 for a sensor number of 4 or more; -9 for NULL; -5 when tuning is not running; -6 when the driver call fails."
    notes: "Set converts the RGB colour of every enabled line, range or window unit to YUV in your structure and keeps a copy; Get puts the colour type and the RGB colour back from that copy, because the driver returns only its own form."
    soc: "T40 only."
  ISP_Get/SetOSDAttr:
    group: osd
    summary: "Reads or sets the ISP OSD attributes (the picture slots the ISP overlays)."
    params:
      num: "Video input."
      attr: "`IMPISPOSDAttr`."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through: the public structure goes to the ISP driver unchanged."
    soc: "T40 (the T23 form is `ISP_Tuning_Get/SetOSDAttr`)."
  ISP_Get/SetSingleOSDAttr:
    group: osd
    summary: "Reads or sets the attributes of a single ISP OSD region (44-byte block)."
    params:
      num: "Sensor number, below 4."
      attr: "`IMPISPSingleOSDAttr`."
    returns: "0 on success; -4 for a sensor number of 4 or more; -9 for NULL; -6 when the driver call fails."
    soc: "T40 only."
  ISP_Tuning_Get/SetOSDAttr:
    group: osd
    summary: Reads or sets the 12-byte OSD picture format of the scaler OSD (T23, T41).
    returns: 'T23: 0, or the error code for a bad sensor number, or -4090 for a failed ioctl. T41: -4087 for NULL, -4084 for
      a sensor of 2 or more, -4091 when tuning is not enabled, -4090 for a failed ioctl.'
    notes: 'The block is passed to the driver unchanged (T41: control 0x80000a1). Normally the ISP OSD region calls fill it
      for you.'
  ISP_Tuning_Get/SetOSDBlock:
    group: osd
    summary: 'Reads or sets one block of the scaler OSD block table: picture number, enable, position and size, physical picture
      address.'
    returns: 'T23: 0, or the error code for a bad sensor number, or -4090 for a failed driver ioctl. T41: -4087 for NULL,
      -4084 for a sensor of 2 or more, -4091 when tuning is not enabled, -4090 for a failed ioctl.'
    notes: T23 and T41 only; the 20-byte block is passed to the driver unchanged. Normally the ISP OSD region calls fill this
      table for you. On T23 the call is wired to the open driver's scaler OSD table (a block above 7 is refused there).
    diff: 'T23: an enabled block with an odd picture width makes the call return -1 without any ioctl (the vendor library
      and ISP accept it, and it stops the T23 ISP). This applies to all three sensor entry points. The open driver refuses
      it too. T41 has no such guard.'
  ISP_Tuning_CreateOsdRgn:
    group: osd
    summary: Creates an ISP OSD region (a picture slot) on a channel and returns its handle.
    params:
      chn: 'Channel: T23 0 to 2 (sensor channel), T40 0 to 5, T41 0 or 1.'
      attr: Must be NULL; the attributes are given later with `SetOsdRgnAttr`.
    returns: Handle (0 to 7) on success, -1 for a bad channel, a non-NULL `attr`, no free slot or an OSD module that is not
      initialised.
    notes: 'Part of the ISP-drawn picture OSD (T23, T40, T41): the picture is copied to media memory and the ISP draws it
      after the scaler. A region is one of 8 picture slots per channel; the handle returned by `CreateOsdRgn` is the slot
      and must equal the picture number in the attribute. The region stays hidden until `ShowOsdRgn`.'
    soc: T23, T40, T41. Other SoCs do not support it.
  ISP_Tuning_DestroyOsdRgn:
    group: osd
    summary: 'Removes an ISP OSD region: hides it, frees its picture memory and gives the slot back.'
    returns: 0 on success, -1 for a bad channel or handle or a region that does not exist.
    soc: T23, T40, T41.
  ISP_Tuning_SetOsdRgnAttr:
    group: osd
    summary: Sets position, size and picture of an ISP OSD region. The picture bytes are copied into media memory; the region
      stays hidden until `ShowOsdRgn`.
    params:
      attr: '`IMPIspOsdAttrAsm`: `type` must be the picture type; the picture, `osd_stride * osd_height` bytes, must lie inside
        the frame of the channel.'
    returns: 0 on success, -1 for a bad channel or handle, NULL, a region that was not created, a picture that does not fit
      the frame, a zero size, a wrong type or when the memory cannot be allocated.
    notes: 'The picture memory comes from the OpenIMP rmem allocator, one block per region, counted against the pool size.
      On T40 and T41 overlapping shown regions are dropped like in the vendor library: a later region that overlaps an earlier
      shown one is not sent. T40 handles chn 0..5 and ISP channel `chx`; T41 draws in main-stream coordinates before the outputs
      are scaled. T23 pictures appear in the frame since the open ISP driver writes the stored pictures into the scaler (checked
      on a camera: picture visible in channel 0 and 1).'
    diff: On T23 an odd picture width (`osd_width`) is refused with -1 before any memory is touched. The vendor library and
      ISP accept it, but an odd width stops the T23 ISP (frames stop in the emulator). The open T23 driver refuses it too
      (-EINVAL). T40 and T41 have no such guard.
    soc: T23, T40, T41.
  ISP_Tuning_GetOsdRgnAttr:
    group: osd
    summary: Reads back the attributes of an ISP OSD region; `osd_enable` shows whether it is currently shown.
    returns: 0 on success, -1 for a bad channel or handle, NULL, or a region that does not exist.
    soc: 'T23, T40, T41 (T41: host-tested only).'
  ISP_Tuning_ShowOsdRgn:
    group: osd
    summary: Shows or hides an ISP OSD region; the ISP is told with the physical picture address.
    params:
      showFlag: 1 shows, 0 hides.
    returns: 0 on success; -1 for a bad channel or handle, a region that does not exist or (T23) a region that has no picture
      yet; on T23 also the driver's failure.
    notes: Needs a picture set with `SetOsdRgnAttr` first. T40 and T41 re-send all regions of the channel after the change
      and drop shown regions that overlap an earlier one.
    soc: T23, T40, T41.
  ISP_Tuning_SetOsdPoolSize:
    group: osd
    summary: Sets the size of the memory pool for ISP OSD pictures, in bytes.
    returns: 0 on success, -1 if `size` is 0 or negative (T23, T40, T41). Elsewhere the call returns 0 for a non-negative
      size and does nothing.
    notes: T23 starts with a pool of 1 MB. OpenIMP counts the sizes of the created regions against the latest value, so the
      call also works after `IMP_System_Init`.
  ISP_OSD_Alloc:
    group: osd
    summary: "Allocates the memory for ISP OSD data (a vendor call of the newest SoCs)."
    notes: "Not provided by OpenIMP on any SoC. T23 has its own `IMP_ISPOSD_Alloc(size)`, which returns the virtual address of an uninitialised rmem buffer or NULL."
    soc: "Missing in OpenIMP."
  ISP_Get/SetDefaultBinPath:
    group: life
    summary: "Sets or reads the path of the ISP tuning binary (`.bin`) loaded at start-up."
    params:
      path: "Path string. On T10 to T31 and T23 at most 63 characters; the getter's buffer needs 64 bytes. On T40 and T41 the first argument is the video input (main only)."
    returns: "0 on success. The setter returns -1 for a NULL pointer, a path that is too long, and on T10 to T31 when the ISP is not open or the sensor is already running. The getter returns -1 for a NULL pointer, when the ISP is not open or no sensor was added (T10 to T31), or on T40 and T41 when no path was ever set and no default file is known."
    notes: "Call the setter after `IMP_ISP_Open` and before `IMP_ISP_AddSensor` (T40 and T41 refuse it once a sensor is added). On T41, when no path was set, the getter reports `/etc/sensor/<sensor>-t41.bin` if that file exists."
  ISP_Tuning_SwitchBin:
    group: life
    summary: "Switches the ISP tuning binary while running: with `enable` 1 it loads the file named in `bname`, with 0 it returns to the sensor's default bin."
    params:
      attr: "`IMPISPBinAttr` with `enable` and the file name (64 bytes on T40, 128 on T41); the name is always terminated in the copy sent to the driver."
    returns: "0 on success. Failures: T40 -4 (video input of 4 or more), -9 (NULL), -5 (tuning not running), -10 (`enable` not 0 or 1), -6 (driver refused). T41 uses the same numbers as -4096 plus the code (-4096+12 for the input, whose limit is 2)."
  ISP_Get/SetFrameDrop:
    group: life
    summary: "Sets or reads the frame drop pattern, which makes the ISP skip frames: three channels, each with an enable flag and a pattern size."
    returns: "0 on success, -1 for a NULL pointer or a missing ISP; otherwise the driver's result. On T40 and T41 only the main input is accepted and the setter refuses a size above 31 or an enable value out of range."
  ISP_Get/SetSensorRegister:
    group: life
    summary: "Writes or reads a register of the sensor directly through the ISP."
    params:
      reg: "Sensor register address. On T41 an `{addr, value}` structure after the video input; on T40 pointers after the video input."
      value: "Value to write, or the output for the read."
    returns: "0 on success, -1 for a NULL pointer, a missing or closed ISP, when no sensor runs, or for a sensor on an SPI bus (only I2C sensors are supported on T10 to T31); otherwise the driver's result. On T40 and T41 only the main input is accepted."
    notes: "For debugging and tuning only; the sensor driver does not know about changes made this way."
  ISP_GetCameraInputMode:
    group: sys
    summary: 'Reads the camera input configuration last stored by `SetCameraInputMode`: six 32-bit words (input mode, select
      mode, frame-source pairing).'
    params:
      mode: Pointer to six `uint32_t`.
    returns: 0 on success, -8 if the ISP is not open, -9 for NULL.
    notes: T40 only. The words are cleared when the ISP is opened and filled by a successful `SetCameraInputMode`.
    soc: T40.
  ISP_SetCameraInputMode:
    group: sys
    summary: "Passes the dual-sensor camera input mode to the ISP driver; the argument is a structure whose first field is the mode number."
    returns: "T23: 0 on success, -1 when the ISP is not open, the pointer is NULL, the mode is 73 or above or its low nibble is 9 or above, or the driver refuses. T40 and T41: 0 on success, -8 when the ISP is not open, -9 for a NULL pointer, -4 for an invalid combination."
    notes: "The accepted mode is remembered. Call it before the sensors are enabled."
  ISP_SetCameraInputSelect:
    group: sys
    summary: Chooses which sensor input is active when the camera input mode is the selecting one.
    params:
      vinum: 0 or 1.
    returns: 0 on success, -8 if the ISP is not open, -10 if the stored camera input mode is not the selecting mode, -9 for
      `vinum` of 2 or more, -1 if the driver ioctl fails.
    notes: T40 only. Needs a prior `SetCameraInputMode` with the select mode.
    soc: T40.
  ISP_Get/SetISPBypass:
    group: ldc
    summary: 'T41 form of the ISP bypass: reads or sets the bypass of the ISP for one video input.'
    params:
      num: Video input, 0 or 1.
      enable: Pointer to `IMPISPTuningOpsMode`.
    returns: 0 on success; -4087 for NULL, -4084 for an input number of 2 or more; -1 when the driver refuses the value.
    notes: T41 only. Set sends the bypass ioctl of the ISP device (0x80085418) and remembers the value for the Get. Setting 0
      (full ISP) works. Setting 1 (the real bypass) is refused by the open driver and the call returns -1, so the value is not
      remembered and Get keeps returning 0 (issue 125). Without an open ISP device the value is only remembered.
    soc: T41.
  ISP_Tuning_SetISPBypass:
    group: ldc
    summary: 'Switches the ISP bypass. On T10, T20, T21, T23 and T31 `ENABLE` (full ISP, the state after `EnableSensor`) does nothing and `DISABLE` (the real bypass) is refused.'
    params:
      enable: '`IMPISP_TUNING_OPS_MODE_ENABLE` or `_DISABLE`.'
    returns: '0 for `ENABLE`; -1 for `DISABLE`. T40: 0 on success, -1 for a video input other than `IMPVI_MAIN` or NULL.'
    notes: 'T10, T20, T21, T23 and T31: `ENABLE` is what a streamer calls at start-up; it is a no-op returning 0 and the running
      pipeline keeps streaming. `DISABLE` (the real bypass) is refused with -1 and nothing is touched, like the vendor T21
      library; on the open drivers a bypassed pipeline delivers no frames (issues 119 and 126; a working real bypass is issue
      129). T40 only stores the flag in the library and sends nothing to the driver. Not in the T41 library under this name
      (see `ISP_Get/SetISPBypass`).'
  ISP_Tuning_GetISPBypass:
    group: ldc
    summary: 'T40: reads the bypass flag stored by `SetISPBypass` (0 before the first Set).'
    returns: 0 on success; -1 for NULL or a video input other than `IMPVI_MAIN`.
    soc: T40.
  ISP_Bypass_Bind:
    group: ldc
    summary: "Programs the three bypass outputs of sensor `num` (enable flag, virtual channel index and DMA index each) so the raw frames go to the selected DMA channels."
    returns: "0 on success, -4 for a sensor number of 4 or more, -9 for a NULL attribute, -8 when the ISP device is not open, -1 when the driver refuses."
    notes: "Call it after `IMP_ISP_Open`, and not together with `IMP_ISP_Tuning_SetISPBypass`."
    soc: "Implemented for T40 and T41."
  ISP_GetRaw:
    group: ldc
    summary: "Captures one raw frame of sensor `num` into a buffer that the library allocates and keeps per sensor (grown when a larger frame is requested); the buffer address and size are returned in the attribute."
    returns: "0 on success, -1 for a NULL attribute, a `raw_bit` other than 8 or 16, a zero size or a driver error, -2 when the buffer cannot be allocated, -4 for a sensor number of 4 or more, -8 when the ISP is not open."
    notes: "`raw_bit` 8 uses width times height bytes, 16 uses twice that. The cache is invalidated so the data read after the call is what the DMA wrote."
    soc: "Implemented for T40; not on T41."
  ISP_Tuning_Get/SetHLDCAttr:
    group: ldc
    summary: "Reads or sets the hardware lens distortion correction."
    params:
      num: "Video input (`IMPVI_MAIN`)."
      attr: "`IMPISPHLDCAttr`."
    returns: "The driver's result; -1 for a bad video input number or NULL."
    notes: "Pointer pass-through: the block goes to the ISP driver unchanged (control 0x8000097)."
    soc: "T40 only."
  ISP_Tuning_SetISPLDC:
    group: ldc
    summary: "Switches the lens distortion correction on or off (a T30 vendor call)."
    notes: "Not provided by OpenIMP on any SoC. The matrix lists it as a gap on T30."
    soc: "Vendor T30 only; missing in OpenIMP."
  ISP_LDC_Get/SetAttr:
    group: ldc
    summary: "Reads or sets the lens distortion correction attributes (a T41 vendor call)."
    notes: "Not provided by OpenIMP on any SoC. The matrix lists it as a gap on T41."
    soc: "Vendor T41 only; missing in OpenIMP."
  ISP_LDC_INIT:
    group: ldc
    summary: "Initialises the lens distortion correction (a T41 vendor call)."
    notes: "Not provided by OpenIMP on any SoC. The matrix lists it as a gap on T41."
    soc: "Vendor T41 only; missing in OpenIMP."
  ISP_Tuning_SetFixedContraster:
    group: color
    summary: "Hands an `IMPISPFixedContrastAttr` to the driver as the fixed-contrast control (T40 and T41 form with a sensor number)."
    returns: "0 on success, non-zero on error."
  ISP_SetFixedContraster:
    group: color
    summary: "Fixes the contrast of the picture: the argument points to an `IMPISPFixedContrastAttr` (mode and a low and a high limit) that is handed to the driver."
    returns: "0 on success, -1 when the tuning session is not open or the pointer is NULL, otherwise the driver result."
    notes: "On T23 the call goes to the sensor-0 form of the multi-camera call. On T10, T20, T21 and T30 the call does nothing and returns 0."
  ISP_Tuning_SetSharpness_internal:
    group: sys
    summary: "Internal sharpness entry (value and mode). On T23 it forwards to the multi-camera internal entry for sensor 0."
    returns: "0 on success, non-zero on error."
    notes: "Exported for compatibility with the vendor library; applications use `IMP_ISP_Tuning_SetSharpness`."
  ISP_Tuning_SetContrast_internal:
    group: sys
    summary: "Internal contrast entry (value and mode). On T23 it forwards to the multi-camera internal entry for sensor 0; elsewhere it needs an open tuning session and logs an error without one."
    returns: "0 on success, non-zero on error."
    notes: "Exported for compatibility with the vendor library; applications use `IMP_ISP_Tuning_SetContrast`."
  ISP_Tuning_SetShading:
    group: sys
    summary: "Sends the enable flag to the ISP driver as the lens-shading control."
    returns: "0 on success, -1 when the tuning session is not open, otherwise the driver result."
    notes: "The T23 implementation prints a trace line to standard output on every call."
    soc: "Implemented on T23 only."
  ISP_SetAeAlgoFunc:
    group: ae
    summary: "Registers an application-supplied auto exposure algorithm as a table of callbacks. The function is copied and kept; it is handed to the driver the next time a sensor is enabled (and is re-registered at every enable)."
    returns: "0 on success, -1 for NULL or no memory."
    notes: "Register before `IMP_ISP_EnableSensor`. `DisableSensor` unregisters the algorithm again, so register it once per run of the sensor."
    diff: "T40 takes the sensor number first, `IMP_ISP_SetAeAlgoFunc(IMPVI_NUM num, IMPISPAeAlgoFunc *)`; a NULL record or a sensor above 3 gives -1. The calls are switched off by default on T40 (-1 with errno ENOTSUP) and need `OPENIMP_ISP_ALGO_FUNC=1`: against the open driver the AWB close oopses the kernel and no statistics reached the callback in QEMU, so the feature is not offered until the driver is fixed and a camera run shows it working. When on, EnableSensor registers the record with the driver, runs `open` with the init attribute the driver fills in, and starts one worker thread (sensors 0 and 1) that calls `handle` for each statistics event and returns the attribute; `SetSensorFPS` calls `notify`."
  ISP_SetAeAlgoFunc_close:
    group: sys
    summary: "Tells the driver to stop using the custom AE algorithm and clears the registration flag."
    returns: "0 on success, -1 when the ISP is not open or the driver refuses."
    notes: "Called by `DisableSensor`."
  ISP_SetAeAlgoFunc_internal:
    group: sys
    summary: "Registers the callback table directly with the driver (used by `EnableSensor`) and then stores it as `SetAeAlgoFunc` does."
    returns: "0 on success, -1 for NULL, when the sensor is already running, or when the driver refuses."
    notes: "Exported for compatibility with the vendor library; applications call `SetAeAlgoFunc`."
  ISP_SetAwbAlgoFunc:
    group: awb
    summary: "Registers an application-supplied auto white balance algorithm as a table of callbacks; handled like `SetAeAlgoFunc`."
    returns: "0 on success, -1 for NULL or no memory."
    notes: "Register before `IMP_ISP_EnableSensor`; `DisableSensor` unregisters it."
    diff: "T40: `IMP_ISP_SetAwbAlgoFunc(IMPVI_NUM num, IMPISPAwbAlgoFunc *)`, switched off by default (-1 / ENOTSUP, `OPENIMP_ISP_ALGO_FUNC=1`), same reasons as `SetAeAlgoFunc`."
  ISP_SetAwbAlgoFunc_close:
    group: sys
    summary: "Tells the driver to stop using the custom AWB algorithm and clears the registration flag."
    returns: "0 on success, -1 when the ISP is not open or the driver refuses."
    notes: "Called by `DisableSensor`."
  ISP_SetAwbAlgoFunc_internal:
    group: sys
    summary: "Registers the AWB callback table with the driver (used by `EnableSensor`) and stores it as `SetAwbAlgoFunc` does."
    returns: "0 on success, -1 for NULL, when the sensor is already running, or when the driver refuses."
    notes: "Exported for compatibility with the vendor library; applications call `SetAwbAlgoFunc`."
  ISP_Tuning_Get/SetFaceAe:
    group: ae
    summary: 'Reads or sets the face-priority exposure: a face window and a brightness target that the AE meters instead of
      the whole picture.'
    params:
      num: Video input (`IMPVI_MAIN`).
      attr: '`IMPISPFaceAttr` (24 bytes on T41).'
    returns: 0 on success; -1 for a bad video input number or NULL, otherwise the driver's result.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. T41 uses control 0x8000035 (vendor
      1.2.6 layout) and the open T41 driver serves it from the vendor AE; on a camera a face target of 40 darkened the picture
      and a target of 180 brightened it (mean luma 98 to 88 and 106). T40 uses the same control number, host-tested only.
      Not in the T10 to T31 APIs.'
    soc: T40 (host-tested) and T41.
  ISP_Tuning_Get/SetFaceAwb:
    group: awb
    summary: 'Reads or sets the face-priority white balance: the AWB uses a face rectangle supplied by the application.'
    params:
      num: Video input (`IMPVI_MAIN`).
      attr: '`IMPISPFaceAttr`.'
    returns: 0 on success; -1 for a bad video input number or NULL, otherwise the driver's result.
    notes: 'Pointer pass-through: the public structure goes to the ISP driver unchanged. Control 0x8000014. T40 only; host-tested,
      not run on a camera.'
    soc: T40 only.
  ISP_SET_GPIO_INIT_OR_FREE:
    group: sys
    summary: "Hands a GPIO description (an int array) to the driver, which claims or releases the pin."
    returns: "0 on success, -1 for NULL or when the ISP is not open, otherwise the driver result."
  ISP_SET_GPIO_STA:
    group: sys
    summary: "Hands a GPIO description (an int array) to the driver, which sets the pin level."
    returns: "0 on success, -1 for NULL or when the ISP is not open, otherwise the driver result."
  ISP_SetSwitchgpio:
    group: sys
    summary: "Selects the GPIO that switches between two sensors on a multi-camera board."
    returns: "0."
    notes: "OpenIMP exports only the `IMP_ISP_MultiCamera_SetSwitchgpio` spelling, on T23. A one-sensor T23 has no sensor switch, so the call does nothing and returns 0."
    soc: "T23 only."
  ISP_SetPreDqtime:
    group: sys
    summary: "Hands a pre-dequeue time value to the ISP driver (T40 and T41)."
    returns: "0 on success, -4 for a sensor number of 4 or more, -9 for a NULL pointer, -8 when the ISP device is missing, -6 when the driver refuses."
  ISP_SetStreamOut:
    group: sys
    summary: "Hands a state structure to the driver's stream-out request."
    returns: "0 on success, -1 when the ISP is not open or the pointer is NULL, otherwise the driver result."
    soc: "Implemented on T23 only."
  ISP_StreamCheck:
    group: sys
    summary: "Hands a state structure to the driver's stream-check request."
    returns: "0 on success, -1 when the ISP is not open or the pointer is NULL, otherwise the driver result."
    soc: "Implemented on T23 only."
  ISP_Tuning_GetNCUAlloc:
    group: sys
    summary: "Returns the NCU buffer allocation of sensor 0 that `IMP_ISP_AddSensor` made, as an integer (0 when there is none)."
    soc: "Implemented on T23 only."
  ISP_Tuning_GetNCUInfo:
    group: sys
    summary: "Reads the NCU information block of the ISP driver into the buffer you pass."
    returns: "0 on success, non-zero for a NULL pointer or a driver error."
    soc: "Implemented on T23 only."

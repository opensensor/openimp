# Descriptions for the System API page (tools/gen_api_wiki.py -> wiki page API-System).
# Own words only; the vendor documentation is read for understanding, never copied.
title: System (IMP_System, memory pools, log, decoder, SU)
intro: |
  The System module starts and stops the library, connects modules into a pipeline with bind calls, hands out
  timestamps and gives access to a few system facilities. Every program calls `IMP_System_Init` once before it
  creates FrameSource channels, encoder channels, OSD or IVS groups, and `IMP_System_Exit` at the end.

  **Pipeline cells:** a *cell* (`IMPCell`) names one output of one module: device (`DEV_ID_FS`, `DEV_ID_ENC`,
  `DEV_ID_OSD`, `DEV_ID_IVS`, ...), group (or channel) and output index. `IMP_System_Bind(src, dst)` connects the output
  of `src` to the input of `dst`, for example FrameSource channel 0 to encoder group 0. OpenIMP records the bind;
  the consumer (the encoder, the IVS group) pulls frames from the source when it starts, so bind **before** the consumer
  starts. At most 16 binds exist at a time.

  **Extensions in this module (OpenIMP only):** `OpenIMP_*` functions that belong to FrameSource, such as the
  fallback test frame, are described on the [FrameSource page](API-FrameSource) and in
  [Beyond the Vendor](Beyond-the-Vendor).
groups:
  - id: life
    title: Start and stop
  - id: bind
    title: Binding modules
  - id: time
    title: Time and identification
  - id: reg
    title: Register access
    intro: Direct access to hardware registers by physical address through `/dev/mem`. For debugging and bring-up, not for streamers.
  - id: pool
    title: Memory pools
    intro: |
      A pool reserves a block of media memory under an id; channels bound to it with `IMP_FrameSource_SetPool` or
      `IMP_Encoder_SetPool` take their buffers from it. T41 carves a real contiguous pool out of the rmem arena. On the
      other SoCs OpenIMP allocates every channel from its single rmem arena anyway, so a requested pool is validated and
      recorded by name but reserves nothing (reserving memory that nothing draws from would only shrink the arena).
  - id: log
    title: Logging
  - id: dec
    title: Decoder (T23)
    intro: A hardware JPEG decoder on channel 0, implemented by OpenIMP on T23 only. The T40 and T41 SDK headers declare the decoder calls, but the vendor libraries that were checked (T40 1.3.1, T41 1.2.5 and 1.2.6, nm and strings) do not export them, so nothing is missing there. It decodes JPEG pictures into NV12, NV21 or YUV420P and runs in the helper process that also hosts the T23 H.264 encoder. The status row is marked as having a known defect because that helper is off by default since agg-37, so the decoder is not usable in a default T23 build.
  - id: su
    title: System utilities (SU)
functions:
  System_Init:
    group: life
    summary: Initialises the library, starts the system clock at zero and prepares the FrameSource, IVS, OSD, encoder and framebuffer parts.
    returns: 0 on success and when already initialised; negative when one of the parts fails (those already started are shut down again).
    notes: Call it once, before any other module call.
  System_Exit:
    group: life
    summary: Shuts the parts down in the reverse order.
    returns: 0, also when not initialised.
  System_Bind:
    group: bind
    summary: Connects the output cell `src` to the input cell `dst`.
    params:
      src: Source cell.
      dst: Destination cell.
    returns: 0 on success and when the same bind already exists; -1 for a NULL cell or when all bind slots are used.
    notes: Typical binds are FrameSource -> encoder, FrameSource -> IVS, FrameSource -> OSD -> encoder. For an OSD group in the middle use `IMP_OSD_AttachToGroup`.
    see_also: [System_UnBind, System_GetBindbyDest]
  System_UnBind:
    group: bind
    summary: Removes a bind.
    returns: 0 on success; -1 for a NULL cell or when no such bind exists.
  System_GetBindbyDest:
    group: bind
    summary: Finds the source cell that feeds a destination cell.
    params:
      dst: Destination cell.
      src: Receives the source cell.
    returns: 0 on success; -1 for a NULL pointer or when nothing is bound to `dst`.
  System_GetVersion:
    group: time
    summary: Writes the version text of the library into a buffer.
    params:
      version: Buffer of at least 64 bytes; it is zeroed and the text is copied in.
    returns: -1 for NULL.
    diff: The text is OpenIMP's own, for example `libimp.so T31 openimp`; the vendor library returns its release number.
  System_GetCPUInfo:
    group: time
    summary: Returns the name of the SoC variant, for example `T31X`, `T41NQ` or `T40-XP`.
    returns: A pointer to a constant string, never NULL.
    notes: The variant is read from the SoC when possible; otherwise a default of the family is returned.
  System_GetTimeStamp:
    group: time
    summary: Returns the system time in microseconds since `System_Init` (or since the last `RebaseTimeStamp`), taken from a monotonic clock.
    returns: The time, or -1 when the clock cannot be read.
    notes: FrameSource frame timestamps are on this timeline.
  System_RebaseTimeStamp:
    group: time
    summary: Moves the system timeline so that the current moment has the given value.
    params:
      timestamp: New "now" in microseconds.
    returns: 0, or -1 when the clock cannot be read.
    notes: Use it to align the timeline with an external clock (for example the first RTP timestamp).
  System_ReadReg32:
    group: reg
    summary: Reads a 32-bit hardware register at a physical address.
    params:
      addr: Physical address, must be 4-byte aligned.
    returns: The register value; 0 when the address is not aligned or `/dev/mem` cannot be used (a failure cannot be told from a register that reads 0).
    notes: The access maps one page of `/dev/mem` per call. It was tested by reading and writing a scratch register of the UART.
  System_WriteReg32:
    group: reg
    summary: Writes a 32-bit hardware register at a physical address.
    params:
      addr: Physical address, 4-byte aligned.
      value: Value to write.
    returns: no value.
    notes: Writing the wrong register can hang the SoC.
  System_MemPoolRequest:
    group: pool
    summary: Requests a memory pool under an id.
    params:
      poolId: Pool number, 0 to 31 on T31, T40 and T41.
      size: Bytes, above 0.
      name: Label for diagnostics.
    returns: "0 on success; -1 for an invalid id, a size of 0, a size above 2 GiB (T41), when the id is already requested (T31, T40, T41) or when the memory is not available (T41)."
    diff: "T41 reserves a real block in rmem, as the vendor library does. T23, T31 and T40 only record the request."
  System_MemPoolFree:
    group: pool
    summary: Releases a pool.
    returns: "-1 for an invalid or not requested pool. On T41 also -1 while a buffer of the pool is still allocated; the channels bound to the pool are unbound and may be bound again with `IMP_FrameSource_SetPool`."
    diff: "Beyond the vendor on T41: the vendor library keeps a pool until the program exits, OpenIMP lets the application release it."
  MemPool_InitPool:
    group: pool
    decl: "int IMP_MemPool_InitPool(int pool_id, uint32_t size, int flags);  /* T21, T23, T30, T31 */\nint IMP_MemPool_InitPool(int pool_id, uint32_t size, const char *name);  /* T40, T41 */"
    summary: "Low-level pool creation; not in the public header. On T41 it is the call behind `System_MemPoolRequest`."
    returns: "0 on success; -1 for an invalid id, a size of 0, a pool that is already in use, or when the memory is not available."
    notes: "T21, T23, T30 and T31: ids 0 to 15, one DMA block of the given size, `flags` is ignored. T40 and T41: ids 0 to 31, size up to 2 GiB, the block is carved out of rmem as one contiguous range and registered under the id with its name. On T40 the System call only records the request and does not use this function. Use `System_MemPoolRequest`."
  MemPool_GetById:
    group: pool
    decl: "int IMP_MemPool_GetById(int pool_id, void *info_out);  /* T21, T23, T30, T31 */\nvoid *IMP_MemPool_GetById(int pool_id);  /* T40, T41 */"
    summary: "Looks up a pool by id. Not in the public header."
    returns: "T21, T23, T30, T31: 0 and an `IMPDMABufferInfo` (name, physical and virtual address, size, id) in `info_out`; -1 for an invalid id, a NULL pointer or a pool that is not in use. T40, T41: a non-NULL pointer when the pool exists, otherwise NULL."
    notes: "On T41 FrameSource checks it before it binds a channel to the pool."
  MemPool_Release:
    group: pool
    decl: "int IMP_MemPool_Release(int pool_id);"
    summary: "Low-level release of a pool. Use `System_MemPoolFree` where it exists."
    returns: "0 on success and for a pool that is not in use; -1 for an invalid id."
    notes: "Only on T21, T23, T30 and T31 (ids 0 to 15); it frees the DMA block. T40 and T41 release pools through `System_MemPoolFree`."
    soc: "T21, T23, T30 and T31."
  PoolAlloc:
    group: pool
    decl: "uintptr_t IMP_PoolAlloc(int pool_id, void *info, intptr_t size, char *tag);"
    summary: "Allocates a buffer from the pool `pool_id` made with `MemPool_InitPool`. Not in the public header."
    returns: "Descriptor form (`info` is a descriptor): 0 and the virtual and physical address in the descriptor, -1 on failure. Size form: the virtual address, 0 on failure."
    notes: "Free with `PoolFree`. The T31 vendor library takes the same four arguments and allocates through the pool object."
  PoolFree:
    group: pool
    decl: "void IMP_PoolFree(void *ptr);"
    summary: "Gives a pool buffer back. Not in the public header."
    notes: "No return value."
  PoolAlloc_Dump:
    group: pool
    decl: "int IMP_PoolAlloc_Dump(void);"
    summary: "Prints the pools and the buffers allocated from them to the log. Debug aid."
    returns: 0.
  PoolAlloc_Set_Attr:
    group: pool
    decl: "int IMP_PoolAlloc_Set_Attr(uint32_t alignment, uint32_t cache_policy);"
    summary: "Stores the alignment and cache policy for later pool allocations."
    returns: 0.
    diff: "The T31 vendor function is an empty stub that returns 0 and stores nothing. OpenIMP stores the values and `PoolAlloc_Get_Attr` reads them back; the allocator itself does not use them (extra, documented)."
  PoolAlloc_Get_Attr:
    group: pool
    decl: "int IMP_PoolAlloc_Get_Attr(uint32_t *alignment, uint32_t *cache_policy);"
    summary: "Reads back the values stored by `PoolAlloc_Set_Attr` (default 4096 and 0)."
    returns: 0.
    diff: "The T31 vendor function returns 0 and leaves both outputs untouched. OpenIMP fills them (extra, documented)."
  PoolFlushCache:
    group: pool
    decl: "int IMP_PoolFlushCache(void *ptr, uint32_t size);"
    summary: "Writes the data cache of a pool buffer back to memory."
    returns: "0; -1 for a NULL pointer or a size of 0."
    diff: "The T31 vendor function is an empty stub that returns 0. OpenIMP flushes the range through the memory driver (extra, documented)."
  PoolPhys_to_Virt:
    group: pool
    decl: "void *IMP_PoolPhys_to_Virt(uint32_t phys);"
    summary: "Converts a physical address inside a pool buffer to the virtual address."
    returns: "The address, NULL when it is not inside a live buffer."
    diff: "The T31 vendor function always returns 0. OpenIMP converts (extra, documented)."
  PoolVirt_to_Phys:
    group: pool
    decl: "uint32_t IMP_PoolVirt_to_Phys(void *virt);"
    summary: "Converts a virtual address inside a pool buffer to the physical address."
    returns: "The address, 0 when it is not inside a live buffer."
    diff: "The T31 vendor function always returns 0. OpenIMP converts (extra, documented)."
  Phys_to_Virt:
    group: pool
    decl: "void *IMP_Phys_to_Virt(uint32_t phys);"
    summary: "Converts a physical address inside an `IMP_Alloc` buffer to the virtual address (offsets inside the buffer work). Not in the public header."
    returns: "The address, NULL when it is not inside a live buffer."
  Virt_to_Phys:
    group: pool
    decl: "uint32_t IMP_Virt_to_Phys(void *virt);"
    summary: "Converts a virtual address inside an `IMP_Alloc` buffer to the physical address. Not in the public header."
    returns: "The address, 0 when it is not inside a live buffer."
  Sp_Alloc:
    group: pool
    decl: "uintptr_t IMP_Sp_Alloc(int size, char *tag);"
    summary: "Allocates a physically contiguous buffer, like `IMP_Alloc`, and returns its virtual address. Not in the public header."
    returns: "The virtual address, 0 on failure."
    diff: "Open question on T31: the vendor function was disassembled and takes a descriptor pointer plus a second non-NULL argument and returns 0 or -1 (it fills the descriptor through the allocator's info call). The OpenIMP call form follows the T23 library. No streamer calls it; the T31 form is not tested on a camera."
  Log_Get/Set_Option:
    group: log
    decl: "int IMP_Log_Get_Option(void);\nvoid IMP_Log_Set_Option(int option);"
    summary: Reads or sets which fields (file, line, function, ...) the library prints in front of a log message.
    params:
      option: Bit mask of the `IMP_LOG_OP_*` flags; `IMP_LOG_OP_NONE` gives the terse vendor line.
    returns: Get returns the mask, Set has no return value.
    notes: OpenIMP prints warnings and errors to stderr always, informational and debug messages only when `OPENIMP_DEBUG_TRACE` is set. Syslog output is enabled with `OPENIMP_LOG_SYSLOG=1`. The default mask is the full one.
    diff: The vendor library starts with no fields and prints everything it has; OpenIMP is quiet by default so a camera is not flooded.
  Decoder_CreateChn:
    group: dec
    summary: Creates the decoder channel 0 and starts the decoding worker.
    params:
      chn: Channel, only 0.
      attr: Decoder attribute; the type must be JPEG, the maximum size non-zero, the pixel format NV12, NV21 or YUV420P.
    returns: -1 for another channel, another payload type or pixel format, a zero size, an existing channel or when the worker cannot be started.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_DestroyChn:
    group: dec
    summary: Stops the worker and releases all frames.
    returns: -1 for another channel or a channel that does not exist.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_StartRecvPic:
    group: dec
    summary: Marks the channel as receiving.
    returns: -1 for another channel or a channel that does not exist.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_StopRecvPic:
    group: dec
    summary: Marks the channel as not receiving and wakes any waiting caller.
    returns: -1 for another channel or a channel that does not exist.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_SendStreamTimeout:
    group: dec
    summary: Decodes one JPEG picture. It waits up to the timeout for a free picture buffer, decodes in the helper process and queues the picture.
    params:
      stream: JPEG data (`p_payload`, `i_payload`) and a timestamp that is passed on to the picture.
      timeout_ms: Maximum wait in milliseconds for a buffer and for the decode.
    returns: -1 for another channel, an empty or NULL stream, no free buffer within the timeout, or a decode error.
    notes: Number of pictures that can be held at once is the `nrKeepStream` of the channel attribute (at least 1). Give every picture back with `ReleaseFrame`.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_PollingFrame:
    group: dec
    summary: Waits until a decoded picture is ready.
    returns: 0 when ready; -1 on timeout, for another channel or when the channel does not exist.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_GetFrame:
    group: dec
    summary: Hands out the oldest decoded picture (a pointer to its frame info with address and size).
    returns: -1 when none is ready, for another channel, NULL or when the channel does not exist.
    soc: Implemented by OpenIMP on T23 only.
  Decoder_ReleaseFrame:
    group: dec
    summary: Gives a picture back so the buffer can be reused.
    returns: -1 for another channel, NULL, or a frame that was not handed out.
    soc: Implemented by OpenIMP on T23 only.
  SU_Base_Get/SetTime:
    group: su
    decl: "int SU_Base_GetTime(SUTime *time);\nint SU_Base_SetTime(SUTime *time);"
    summary: "Reads or sets the battery-backed RTC (`/dev/rtc0`). Month is 1 to 12 and the year is the full year."
    returns: "0, -1 when the RTC node cannot be opened or the ioctl fails (a board without an RTC driver)."
    soc: "T40 (ported from the vendor libsysutils into libimp; other SoCs use the vendor libsysutils.so)."
  SU_Base_Get/SetAlarm:
    group: su
    decl: "int SU_Base_GetAlarm(SUTime *time);\nint SU_Base_SetAlarm(SUTime *time);"
    summary: "Reads or sets the RTC alarm time."
    returns: "0, -1 on a missing RTC or a failing ioctl."
    soc: "T40."
  SU_Base_EnableAlarm:
    group: su
    decl: "int SU_Base_EnableAlarm(void);"
    summary: "Switches the RTC alarm interrupt on. Refused with -1 unless the alarm time lies after the current time."
    notes: "An armed alarm can wake or power the camera on boards that wire it up."
    soc: "T40."
  SU_Base_DisableAlarm:
    group: su
    decl: "int SU_Base_DisableAlarm(void);"
    summary: "Switches the RTC alarm interrupt off."
    soc: "T40."
  SU_Base_PollingAlarm:
    group: su
    decl: "int SU_Base_PollingAlarm(uint32_t timeoutMsec);"
    summary: "Waits up to `timeoutMsec` for the RTC alarm."
    returns: "0, also after the timeout (the vendor only logs it); -1 when the RTC node cannot be opened."
    soc: "T40."
  SU_Base_Reboot:
    group: su
    decl: "int SU_Base_Reboot(void);"
    summary: "Syncs and sends SIGTERM to init (reboot on busybox init). Returns 0."
    soc: "T40."
  SU_Base_Suspend:
    group: su
    decl: "int SU_Base_Suspend(void);"
    summary: "Writes `mem` to `/sys/power/state`."
    returns: "0, -1 when the node cannot be opened or written."
    soc: "T40."
  SU_ADC_Init:
    group: su
    decl: "int SU_ADC_Init(void);"
    summary: "Opens the six ADC channel nodes `/dev/ingenic_adc_aux_0` to `_5`."
    returns: "0, -1 when one node is missing (the board has no ADC driver)."
    soc: "T40."
  SU_ADC_Exit:
    group: su
    decl: "int SU_ADC_Exit(void);"
    summary: "Closes the channel nodes."
    soc: "T40."
  SU_ADC_EnableChn:
    group: su
    decl: "int SU_ADC_EnableChn(uint32_t chn_num);"
    summary: "Switches an ADC channel on (0 to 5)."
    returns: "0, -1 for a channel above 5, before `SU_ADC_Init` or on an ioctl error."
    soc: "T40."
  SU_ADC_DisableChn:
    group: su
    decl: "int SU_ADC_DisableChn(uint32_t chn_num);"
    summary: "Switches an ADC channel off."
    soc: "T40."
  SU_ADC_GetChnValue:
    group: su
    decl: "int SU_ADC_GetChnValue(uint32_t chn_num, int *value);"
    summary: "Reads the current value of an ADC channel."
    returns: "0, -1 for a bad channel, NULL pointer or a failing read."
    soc: "T40."
  SU_Key_ReadEvent:
    group: su
    decl: "int SU_Key_ReadEvent(int evfd, int *keyCode, SUKeyEvent *event);"
    summary: "Blocks until a key event arrives on the handle of `SU_Key_OpenEvent`; returns the key code (low 8 bits of the input code) and pressed / released."
    returns: "0, -1 on a read error."
    notes: "Key press events of the `gpio_keys` input device only."
    soc: "T40."
  SU_Key_EnableEvent:
    group: su
    decl: "int SU_Key_EnableEvent(int keyCode);"
    summary: "Takes a hardware key out of the `disabled_keys` list of the gpio_keys driver again."
    returns: "0, -1 when the gpio_keys sysfs nodes are missing."
    soc: "T40."
  SU_Key_DisableEvent:
    group: su
    decl: "int SU_Key_DisableEvent(int keyCode);"
    summary: "Masks a hardware key in the gpio_keys driver (`disabled_keys`)."
    returns: "0, -1 when the gpio_keys sysfs nodes are missing."
    soc: "T40."
  SU_LED_Command:
    group: su
    decl: "int SU_LED_Command(int ledNum, SULedCmd cmd);"
    summary: "Drives the LED on GPIO `ledNum` through sysfs (export, active_low 0, direction out, value). `LED_GPIO_UNEXPORT` writes 0 and releases the GPIO."
    returns: "0, -1 when one of the sysfs nodes cannot be opened."
    soc: "T40."
  SU_CIPHER_Init:
    group: su
    decl: "int SU_CIPHER_Init(void);"
    summary: "Hardware AES engine of the vendor library. Not provided: the open stack has no AES/DES kernel driver."
    returns: "-1 with `errno` ENOTSUP; the same for `SU_CIPHER_Exit`, `CreateHandle`, `DestroyHandle`, `ConfigHandle`, `Encrypt`, `Decrypt`, `DES_Init`, `DES_Exit` and `DES_Test`."
    notes: "The vendor library answers -1 as well on a kernel without `/dev/aes` and `/dev/jz-des`. Software AES/DES would be an extra beyond the vendor and is not offered."
    soc: "T40."
  SU_Base_Shutdown:
    group: su
    decl: "int SU_Base_Shutdown(void);"
    summary: Syncs the file systems and tells the init process to reboot (or power off).
    returns: 0 when the signal reached init, -1 (with `errno`) when it could not be sent.
    notes: "The call returns before the shutdown has finished. The environment variable `OPENIMP_SU_SHUTDOWN` selects what init is asked to do: unset or `reboot` sends SIGTERM (reboot on busybox init), `poweroff` sends SIGUSR2 (power off), `vendor` sends SIGCHLD like the vendor library."
    diff: "The vendor library only sends SIGCHLD, which busybox init ignores, so on such a system the camera keeps running. OpenIMP's default sends the signal busybox acts on."
